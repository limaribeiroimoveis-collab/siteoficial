function mascaraTelefone(input){
  let v = input.value.replace(/\D/g, '');
  if(v.length > 11) v = v.slice(0, 11);
  let out = '';
  if(v.length === 0) out = '';
  else if(v.length <= 2) out = '(' + v;
  else if(v.length <= 3) out = '(' + v.slice(0,2) + ') ' + v.slice(2);
  else if(v.length <= 7) out = '(' + v.slice(0,2) + ') ' + v.slice(2,3) + ' ' + v.slice(3);
  else out = '(' + v.slice(0,2) + ') ' + v.slice(2,3) + ' ' + v.slice(3,7) + '-' + v.slice(7);
  input.value = out;
}

function toast(msg, type=''){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3200);
}
function normalizaTel(t){ return String(t || '').replace(/\D/g, ''); }
function esc(s){
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtTel(t){
  const n = normalizaTel(t);
  if(n.length === 11) return `(${n.slice(0,2)}) ${n.slice(2,3)} ${n.slice(3,7)}-${n.slice(7)}`;
  if(n.length === 10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
  return String(t || '');
}
function fmtData(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '';
  const dia = String(dt.getDate()).padStart(2,'0');
  const mes = String(dt.getMonth()+1).padStart(2,'0');
  const ano = dt.getFullYear();
  const ds = DIAS_SEMANA[dt.getDay()];
  return `${dia}/${mes}/${ano} - ${ds}`;
}
function fmtDataCurta(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '';
  const dia = String(dt.getDate()).padStart(2,'0');
  const mes = String(dt.getMonth()+1).padStart(2,'0');
  const ds = DIAS_SEMANA_CURTO[dt.getDay()];
  return `${dia}/${mes} - ${ds}`;
}
function fmtDataHora(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '';
  const h = String(dt.getHours()).padStart(2,'0');
  const m = String(dt.getMinutes()).padStart(2,'0');
  return fmtData(dt) + ' às ' + h + ':' + m;
}
function fmtDataHoraCurta(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '';
  const h = String(dt.getHours()).padStart(2,'0');
  const m = String(dt.getMinutes()).padStart(2,'0');
  return fmtData(dt) + ' · ' + h + ':' + m;
}
function diasAtras(d){
  if(!d) return null;
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return null;
  return Math.floor((Date.now() - dt.getTime()) / 86400000);
}
function toInputDate(iso){
  if(!iso) return '';
  try {
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off * 60000);
    return local.toISOString().slice(0,10);
  } catch(e){ return ''; }
}
function toInputDateTime(iso){
  if(!iso) return '';
  try {
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off * 60000);
    return local.toISOString().slice(0,16);
  } catch(e){ return ''; }
}
function hojeISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0,10);
}
function classificarAgendamento(iso){
  if(!iso) return { label: '—', classe: 'distante' };
  const d = new Date(iso);
  if(isNaN(d.getTime())) return { label: '—', classe: 'distante' };
  const hoje = new Date();
  const diff = Math.floor((d - hoje) / 86400000);
  let classe = 'distante';
  if(d.toDateString() === hoje.toDateString()) classe = 'hoje';
  else if(diff === 1) classe = 'amanha';
  else if(diff >= 2 && diff <= 7) classe = 'semana';
  return { label: fmtDataHoraCurta(d), classe };
}
function emojiTemperatura(temp){

  if(temp === 'morno') return '🌡️';

function chaveCorretorExata_(nome){

function chaveCorretorGrupo_(nome){
  const s = String(nome || '').trim();
  if(!s) return '';
  const idx = s.indexOf('/');
  if(idx > 0) return s.slice(0, idx).trim();
  return s;
}
function nomeCompletoCliente_(nome, telefone){
  const n = String(nome || '').trim() || 'Sem nome';
  const tel = normalizaTel(telefone);
  if(tel.length >= 4) return n + ' ' + tel.slice(-4);
  return n;
}
function primeiroNome_(nome){
  return String(nome || '').trim().split(/\s+/)[0] || 'Cliente';
}
function camposEndereco_(im){
  if(!im) return { rua: '', numero: '', bairro: '', chave: '' };
  return {
    rua:    String(im.rua        || '').trim(),
    numero: String(im.numero     || '').trim(),
    bairro: String(im.bairro     || '').trim(),
    chave:  String(im.chaveTexto || '').trim()
  };
}
function isEvento_(a){
  if(!a) return false;
  if(a._isEventoNeutro) return true;
  const id = String(a.id || '');
  if(id.startsWith(PREFIXO_EVENTO)) return true;
  const cod = String(a.codigo || '');
  if(cod.startsWith(PREFIXO_EVENTO)) return true;
  const tel = normalizaTel(a.telefone || '');
  if(!tel || tel === '00000000000') return true;
  return false;
}
function resolverCorretor_(item){
  if(!item) return '';
  if(item.corretor) return String(item.corretor).trim();
  const idIm = String(item.id || '');
  if(idIm && state._corretorPorImovelId && state._corretorPorImovelId[idIm]){
    return String(state._corretorPorImovelId[idIm]).trim();
  }
  const tel = normalizaTel(item.telefone || '');
  if(tel && tel !== '00000000000'){
    const cli = state.clientes.find(c => normalizaTel(c.telefone) === tel);
    if(cli && cli.corretor) return String(cli.corretor).trim();
  }
  const nome = String(item.clienteNome || '').trim().toLowerCase();
  if(nome){
    const cli = state.clientes.find(c => (c.nome||'').trim().toLowerCase() === nome);
    if(cli && cli.corretor) return String(cli.corretor).trim();
  }
  return '';
}
function tituloEventoLimpo_(a){
  let t = String(a.rua || a.titulo || a.clienteNome || 'Evento').trim();
  t = t.replace(/,?\s*(000|S\/N|s\/n|-|\.)\s*/g, ' ').replace(/\s+/g, ' ').trim();
  const desc = String(a.bairro || '').trim();
  if(desc){
    const idx = t.toLowerCase().lastIndexOf(' - ' + desc.toLowerCase());
    if(idx > 0) t = t.slice(0, idx).trim();
  }
  return t || 'Evento';
}

function parseCutucada_(valor){
  if(!valor) return null;
  const s = String(valor).trim();
  if(!s) return null;
  const idx = s.indexOf('|');
  if(idx < 0) return null;
  const dataIso = s.slice(0, idx).trim();
  const texto = s.slice(idx + 1).trim();
  if(!dataIso || !texto) return null;
  const d = new Date(dataIso);
  if(isNaN(d.getTime())) return null;
  return {
    dataIso: dataIso,
    dataFmt: formatarDataHoraCurta_(d),
    texto: texto,
    timestamp: d.getTime()
  };
}
function formatarDataHoraCurta_(d){
  if(!(d instanceof Date) || isNaN(d.getTime())) return '';
  const dia = String(d.getDate()).padStart(2,'0');
  const mes = String(d.getMonth()+1).padStart(2,'0');
  const ano = d.getFullYear();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${dia}/${mes}/${ano}   ${h}:${m}`;
}

function calcularConflitos_(agendamentos){
  const conflitos = {};
  const lista = (agendamentos || []).filter(a => a.dataVisitaAgendada && !isEvento_(a));
  const porCorretor = {};
  lista.forEach(a => {
    const chave = chaveCorretorExata_(a.corretor) || '(sem corretor)';
    if(!porCorretor[chave]) porCorretor[chave] = [];
    porCorretor[chave].push({
      id: a.id,
      quando: new Date(a.dataVisitaAgendada).getTime(),
      clienteNome: a.clienteNome
    });
  });
  Object.keys(porCorretor).forEach(chave => {
    const arr = porCorretor[chave].sort((a, b) => a.quando - b.quando);
    for(let i = 0; i < arr.length; i++){
      for(let j = i + 1; j < arr.length; j++){
        const diff = Math.abs(arr[j].quando - arr[i].quando);
        if(diff === 0){
          conflitos[arr[i].id] = { nivel: 'alto', motivo: 'Mesmo horário de outro agendamento' };
          conflitos[arr[j].id] = { nivel: 'alto', motivo: 'Mesmo horário de outro agendamento' };
        } else if(diff < 30 * 60 * 1000){
          if(!conflitos[arr[i].id]) conflitos[arr[i].id] = { nivel: 'medio', motivo: 'Intervalo < 30min do próximo' };
          if(!conflitos[arr[j].id]) conflitos[arr[j].id] = { nivel: 'medio', motivo: 'Intervalo < 30min do anterior' };
        }
      }
    }
  });
  return conflitos;
}

function marcarSalvando(inicio){
  if(inicio) state.salvando++;
  else state.salvando = Math.max(0, state.salvando - 1);
}

async function apiOnce(action, params, timeoutMs){
  const qs = new URLSearchParams({ action, ...params, _t: Date.now() }).toString();
  const url = API_URL + '?' + qs;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(url, {
      method: 'GET', mode: 'cors',
      headers: { 'Accept': 'application/json' },
      redirect: 'follow',
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}
async function api(action, params = {}, timeoutMs = TIMEOUT_API, retries = 2) {
  let lastErr;
  for (let i = 0; i <= retries; i++) {
    try { return await apiOnce(action, params, timeoutMs); }
    catch (err) {
      lastErr = err;
      if (i < retries) await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
  console.error('API falhou:', lastErr, { action, params });
  return { ok: false, error: 'Falha ao conectar: ' + lastErr.message };
}

function confirmarAcao(opts){
  return new Promise((resolve) => {
    const backdrop = $('confirmBackdrop');
    const wrapIcon = $('confirmIconWrap');
    $('confirmTitulo').textContent = opts.titulo || 'Confirmar ação';
    $('confirmTexto').textContent  = opts.texto  || 'Tem certeza?';
    wrapIcon.className = 'icon-wrap';
    if(opts.tipo === 'danger') wrapIcon.classList.add('danger');
    if(opts.tipo === 'success') wrapIcon.classList.add('success');
    const btnSim = $('confirmBtnSim');
    const btnNao = $('confirmBtnNao');
    btnSim.textContent = opts.btnSim || 'Confirmar';
    btnNao.textContent = opts.btnNao || 'Cancelar';
    btnSim.className = 'btn ' + (
      opts.tipo === 'danger'  ? 'btn-danger'  :
      opts.tipo === 'success' ? 'btn-success' :
      opts.tipo === 'warn'    ? 'btn-warn'    :
                                'btn-primary'
    );
    const novoSim = btnSim.cloneNode(true);
    const novoNao = btnNao.cloneNode(true);
    btnSim.parentNode.replaceChild(novoSim, btnSim);
    btnNao.parentNode.replaceChild(novoNao, btnNao);
    function fechar(){ backdrop.classList.remove('show'); }
    novoSim.addEventListener('click', () => { fechar(); resolve(true); });
    novoNao.addEventListener('click', () => { fechar(); resolve(false); });
    backdrop.classList.add('show');
    setTimeout(() => novoSim.focus(), 80);
  });
}

function mostrarView(id){
  ['adminLoginView','homeView'].forEach(v => {
    const el = $(v);
    if(el) el.classList.add('hidden');
  });
  if(id && $(id)) $(id).classList.remove('hidden');
}
function irParaHomeAdmin(){
  if(!state.isAdmin) return;
  ['agenda','visitar','gostei','clientes'].forEach(p => {
    const cap = p.charAt(0).toUpperCase() + p.slice(1);
    const el = $('panel' + cap);
    const card = $('card' + cap);
    if(el) el.classList.add('hidden');
    if(card) card.classList.remove('active');
  });
  const cap = state.painelAtivo.charAt(0).toUpperCase() + state.painelAtivo.slice(1);
  const elPanel = $('panel' + cap);
  const elCard = $('card' + cap);
  if(elPanel) elPanel.classList.remove('hidden');
  if(elCard) elCard.classList.add('active');
}
function abrirPainel(painel){
  state.painelAtivo = painel;
  ['agenda','visitar','gostei','clientes'].forEach(p => {
    const cap = p.charAt(0).toUpperCase() + p.slice(1);
    const elPanel = $('panel' + cap);
    const elCard = $('card' + cap);
    if(elPanel) elPanel.classList.toggle('hidden', p !== painel);
    if(elCard) elCard.classList.toggle('active', p === painel);
  });
  if(painel === 'agenda' && !state.carregado.agenda) carregarAgenda(true);
  if(painel === 'visitar' && !state.carregado.visitar) carregarNotificacoes(true);
  if(painel === 'gostei' && !state.carregado.gostei) carregarNotificacoes(true);
  if(painel === 'clientes' && !state.carregado.clientes) carregarClientes(true);
}
async function recarregarPainel(painel){
  if(painel === 'agenda'){ state.carregado.agenda = false; await carregarAgenda(true); }
  if(painel === 'visitar'){ state.carregado.visitar = false; await carregarNotificacoes(true); }
  if(painel === 'gostei'){ state.carregado.gostei = false; await carregarNotificacoes(true); }
  if(painel === 'clientes'){ state.carregado.clientes = false; await carregarClientes(true); }
}
function alternarConcluidas(painel){
  state.visaoPainel[painel] = state.visaoPainel[painel] === 'concluidas' ? 'ativas' : 'concluidas';
  const btn = $(painel === 'visitar' ? 'btnVerConcluidasVisitar' : 'btnVerConcluidasGostei');
  if(btn){
    btn.textContent = state.visaoPainel[painel] === 'concluidas' ? 'Ver ativas' : 'Ver concluídas';
    btn.classList.toggle('ativo', state.visaoPainel[painel] === 'concluidas');
  }
  renderizarNotificacoes();
}

async function entrarAdmin(){
  const senha = $('inputAdminSenha').value.trim();
  if(!senha){ toast('Digite a senha', 'error'); return; }
  const btn = $('btnEntrarAdmin');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Validando...';
  marcarSalvando(true);
  const res = await api('adminListar', { senha }, TIMEOUT_LOGIN, 2);
  marcarSalvando(false);
  btn.disabled = false;
  btn.textContent = 'Entrar no painel';
  if(!res.ok){ toast(res.error || 'Senha incorreta', 'error'); return; }
  state.isAdmin = true;
  state.adminSenha = senha;
  localStorage.setItem(ADMIN_KEY, senha);
  await carregarHomeAdmin();
}

async function carregarHomeAdmin(){
  mostrarView('homeView');
  $('btnSair').classList.remove('hidden');
  atualizarBadgeCaptar();
  state.carregado = { agenda: false, visitar: false, gostei: false, clientes: false, geral: false, tarefas: false };
  await carregarCorretores();
  state.painelAtivo = 'agenda';
  ['agenda','visitar','gostei','clientes'].forEach(p => {
    const cap = p.charAt(0).toUpperCase() + p.slice(1);
    const elPanel = $('panel' + cap);
    const elCard = $('card' + cap);
    if(elPanel) elPanel.classList.toggle('hidden', p !== 'agenda');
    if(elCard) elCard.classList.toggle('active', p === 'agenda');
  });
  await carregarAgenda(true);
  carregarResto_();
  iniciarRefreshSilencioso();
}
async function carregarResto_(){
  try {
    await carregarClientes(false);
    await Promise.all([
      carregarNotificacoes(false),
      carregarCorrecoes(false),
      carregarTarefas(false)
    ]);
  } catch(e){
    console.warn('[carregarResto_] erro:', e);

function sair(){
  if(estaSalvando()){
    $('savingOverlay').classList.add('show');
    const check = setInterval(() => {
      if(!estaSalvando()){
        clearInterval(check);
        localStorage.removeItem(ADMIN_KEY);
        location.reload();
      }
    }, 200);
    return;
  }
  localStorage.removeItem(ADMIN_KEY);
  state.isAdmin = false;
  state.adminSenha = null;
  state.clientes = [];
  state.agendamentos = [];
  state.eventosNeutros = [];
  state.notificacoes = { gostei: [], visita: [] };
  state.correcoes = [];
  state.tarefas = [];
  $('btnSair').classList.add('hidden');
  $('inputAdminSenha').value = '';
  mostrarView('adminLoginView');
  pararRefreshSilencioso();
  setTimeout(() => $('inputAdminSenha').focus(), 200);
}

async function carregarCorretores(){
  try {
    const cache = JSON.parse(localStorage.getItem(CORRETORES_CACHE_KEY) || 'null');
    if(cache && Array.isArray(cache.data) && cache.data.length > 0){
      state.corretores = cache.data;
    }
  } catch(e){}
  const res = await api('listarCorretores', { senha: state.adminSenha });
  if(res.ok && res.data){
    state.corretores = res.data;
    try {
      localStorage.setItem(CORRETORES_CACHE_KEY, JSON.stringify({ data: res.data, ts: Date.now() }));
    } catch(e){}
  }
  if(!state.corretores.length){
    state.corretores = [
      { nome: 'Hugo', cor: '#1e40af' },
      { nome: 'Carolina', cor: '#9333ea' }
    ];
  }
  const selTar = $('novaTarefaCorretor');
  if(selTar){
    selTar.innerHTML = '<option value="">— Escolha o corretor —</option>' +
      state.corretores.map(c => `<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join('');
  }
  const selEv = $('eventoCorretor');
  if(selEv){
    selEv.innerHTML = '<option value="">— Escolha o corretor —</option>' +
      state.corretores.map(c => `<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join('');
  }
}

async function carregarTarefas(mostrarLoading){
  if(mostrarLoading){
    const lista = $('tarefasLista');
    if(lista && $('tarefasBackdrop').classList.contains('show')){

    arr = arr.filter(t => t.status === 'concluida');
  } else {

async function criarTarefa(){
  const texto = $('novaTarefaTexto').value.trim();
  const corretor = $('novaTarefaCorretor').value;
  if(!texto){ toast('Escreva a tarefa', 'error'); return; }
  if(!corretor){ toast('Escolha o corretor', 'error'); return; }
  marcarSalvando(true);
  const res = await api('criarTarefa', { senha: state.adminSenha, texto, corretor });
  marcarSalvando(false);
  if(!res.ok){ toast(res.error || 'Erro', 'error'); return; }
  $('novaTarefaTexto').value = '';
  toast('Tarefa criada', 'success');
  state.carregado.tarefas = false;
  await carregarTarefas(false);
}
async function onClickCheckTarefa(id, jaConcluida){
  if(jaConcluida){ await reabrirTarefa(id); return; }
  const ok = await confirmarAcao({
    titulo: 'Concluir tarefa?', texto: 'A tarefa sai da lista de pendentes.',
    btnSim: 'Concluir', tipo: 'success'
  });
  if(!ok) return;
  marcarSalvando(true);
  const res = await api('concluirTarefa', { senha: state.adminSenha, id });
  marcarSalvando(false);
  if(!res.ok){ toast(res.error || 'Erro', 'error'); return; }
  toast('Tarefa concluída', 'success');
  setTimeout(async () => {
    const apagar = await confirmarAcao({
      titulo: 'Apagar tarefa?', texto: 'Deseja excluir essa tarefa da lista de concluídas?',
      btnSim: 'Sim, apagar', btnNao: 'Não, manter', tipo: 'danger'
    });
    if(apagar){
      marcarSalvando(true);
      const r2 = await api('excluirTarefa', { senha: state.adminSenha, id });
      marcarSalvando(false);
      if(r2.ok) toast('Tarefa apagada', 'success');
    }
    state.carregado.tarefas = false;
    await carregarTarefas(false);
  }, 400);
}
async function reabrirTarefa(id){
  marcarSalvando(true);
  const res = await api('reabrirTarefa', { senha: state.adminSenha, id });
  marcarSalvando(false);
  if(!res.ok){ toast(res.error || 'Erro', 'error'); return; }
  toast('Tarefa reaberta', 'success');
  state.carregado.tarefas = false;
  await carregarTarefas(false);
}
async function excluirTarefa(id){
  const ok = await confirmarAcao({
    titulo: 'Apagar tarefa?', texto: 'Essa ação não pode ser desfeita.',
    btnSim: 'Apagar', tipo: 'danger'
  });
  if(!ok) return;
  marcarSalvando(true);
  const res = await api('excluirTarefa', { senha: state.adminSenha, id });
  marcarSalvando(false);
  if(!res.ok){ toast(res.error || 'Erro', 'error'); return; }
  toast('Tarefa apagada', 'success');
  state.carregado.tarefas = false;
  await carregarTarefas(false);
}

async function carregarClientes(mostrarLoading){
  if(mostrarLoading){
    $('clientesLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando clientes...</p></div>';
  }
  const res = await api('listarClientes', { senha: state.adminSenha });
  state.clientes = (res.ok && res.data) ? res.data : [];
  state.carregado.clientes = true;
  atualizarBalClientes();
  renderizarFiltrosClientes();
  renderizarClientes();
}
function atualizarBalClientes(){
  const el = $('balClientes');
  if(el) el.textContent = state.clientes.length;
}
function renderizarFiltrosClientes(){
  const wrap = $('filtrosClientes');
  if(!wrap) return;
  const corretoresEncontrados = new Set();
  state.clientes.forEach(cl => {
    const c = chaveCorretorExata_(cl.corretor);
    if(c) corretoresEncontrados.add(c);
  });
  if(corretoresEncontrados.size === 0){
    corretoresEncontrados.add('Hugo');
    corretoresEncontrados.add('Carolina');
  }
  const listaCorretores = [...corretoresEncontrados].sort((a,b) => a.localeCompare(b,'pt-BR'));
  const corretoresChips = listaCorretores.map(nome => {
    const cnt = state.clientes.filter(cl => chaveCorretorExata_(cl.corretor) === nome).length;
    const ativo = state.filtrosClientes.corretores.has(nome);
    const cor = corDoCorretor(nome) || '#64748b';
    return `<button class="chip chip-corretor ${ativo ? 'active' : ''}"
              style="background:${ativo ? cor : '#fff'}; color:${ativo ? '#fff' : cor}; border-color:${cor}"
              onclick="toggleFiltroClienteCorretor('${esc(nome)}')">
              ${esc(nome)} <span class="cnt">${cnt}</span>
            </button>`;
  }).join('');
  const t = state.filtrosClientes.temperaturas;
  const s = state.filtrosClientes.status;
  const tp = state.filtrosClientes.tipos;
  const cntTemp = { quente: 0, morno: 0, frio: 0 };
  const cntStatus = { ativo: 0, inativo: 0 };
  const cntTipo = { tqc: 0, car: 0 };
  state.clientes.forEach(c => {
    const temp = c.temperatura || 'frio';
    if(cntTemp[temp] !== undefined) cntTemp[temp]++;
    if(String(c.inativo||'').toLowerCase() === 'sim') cntStatus.inativo++;
    else cntStatus.ativo++;
    if(String(c.tqc||'').toLowerCase() === 'sim') cntTipo.tqc++;
    if(String(c.car||'').toLowerCase() === 'sim') cntTipo.car++;
  });
  wrap.innerHTML = `
    <div class="filtro-grupo">
      <span class="lbl">Corretor:</span>
      ${corretoresChips}
      <button class="chip ${state.filtrosClientes.corretores.size === 0 ? 'active' : ''}" onclick="limparFiltroClienteCorretores()">Todos</button>
    </div>
    <div class="filtro-grupo">
      <span class="lbl">Temp:</span>
      <button class="chip ${t.has('quente') ? 'active' : ''}" onclick="toggleFiltroClienteTemp('quente')">🔥 <span class="cnt">${cntTemp.quente}</span></button>
      <button class="chip ${t.has('morno') ? 'active' : ''}" onclick="toggleFiltroClienteTemp('morno')">🌡️ <span class="cnt">${cntTemp.morno}</span></button>
      <button class="chip ${t.has('frio') ? 'active' : ''}" onclick="toggleFiltroClienteTemp('frio')">❄️ <span class="cnt">${cntTemp.frio}</span></button>
    </div>
    <div class="filtro-grupo">
      <span class="lbl">Status:</span>
      <button class="chip ${s.has('ativo') ? 'active' : ''}" onclick="toggleFiltroClienteStatus('ativo')">Ativo <span class="cnt">${cntStatus.ativo}</span></button>
      <button class="chip ${s.has('inativo') ? 'active' : ''}" onclick="toggleFiltroClienteStatus('inativo')">Inativo <span class="cnt">${cntStatus.inativo}</span></button>
    </div>
    <div class="filtro-grupo">
      <span class="lbl">Tipo:</span>
      <button class="chip ${tp.has('tqc') ? 'active' : ''}" onclick="toggleFiltroClienteTipo('tqc')"><strong>TQC</strong> <span class="cnt">${cntTipo.tqc}</span></button>
      <button class="chip ${tp.has('car') ? 'active' : ''}" onclick="toggleFiltroClienteTipo('car')"><strong>INVESTIDOR</strong> <span class="cnt">${cntTipo.car}</span></button>
    </div>
  `;
}

let _buscaClienteTimer = null;
function onBuscaClienteChanged(){
  clearTimeout(_buscaClienteTimer);
  _buscaClienteTimer = setTimeout(() => renderizarClientes(), 250);
}
function renderizarClientes(){
  const lista = $('clientesLista');
  const empty = $('clientesEmpty');
  const busca = ($('buscaCliente').value || '').toLowerCase().trim();
  const ordem = $('ordenacaoCliente').value;
  let arr = [...state.clientes];
  if(state.filtrosClientes.corretores.size > 0){
    arr = arr.filter(c => state.filtrosClientes.corretores.has(chaveCorretorExata_(c.corretor)));
  }
  if(state.filtrosClientes.temperaturas.size > 0){
    arr = arr.filter(c => state.filtrosClientes.temperaturas.has(c.temperatura || 'frio'));
  }
  if(state.filtrosClientes.status.size > 0){
    const querAtivo = state.filtrosClientes.status.has('ativo');
    const querInativo = state.filtrosClientes.status.has('inativo');
    arr = arr.filter(c => {
      const inativo = String(c.inativo || '').toLowerCase() === 'sim';
      if(querAtivo && !querInativo) return !inativo;
      if(querInativo && !querAtivo) return inativo;
      return true;
    });
  }
  if(state.filtrosClientes.tipos.size > 0){
    arr = arr.filter(c => {
      const temTqc = String(c.tqc||'').toLowerCase() === 'sim';
      const temCar = String(c.car||'').toLowerCase() === 'sim';
      return (state.filtrosClientes.tipos.has('tqc') && temTqc) ||
             (state.filtrosClientes.tipos.has('car') && temCar);
    });
  }
  if(busca){
    const b = busca;
    const bTel = normalizaTel(busca);
    arr = arr.filter(c =>
      (c.nome || '').toLowerCase().includes(b) ||
      (bTel && normalizaTel(c.telefone).includes(bTel))
    );
  }
  arr.sort((a, b) => {
    const ia = String(a.inativo||'').toLowerCase() === 'sim' ? 1 : 0;
    const ib = String(b.inativo||'').toLowerCase() === 'sim' ? 1 : 0;
    if(ia !== ib) return ia - ib;
    if(ordem === 'alfabetica') return (a.nome||'').localeCompare(b.nome||'', 'pt-BR', {sensitivity:'base'});
    if(ordem === 'data') return new Date(b.dataCadastro||0) - new Date(a.dataCadastro||0);
    if(ordem === 'recentes' || ordem === 'acao-admin'){
      const da = a.dataUltimaAcaoAdmin ? new Date(a.dataUltimaAcaoAdmin).getTime() : 0;
      const db = b.dataUltimaAcaoAdmin ? new Date(b.dataUltimaAcaoAdmin).getTime() : 0;
      return db - da;
    }
    if(ordem === 'acao-cliente'){
      const da = a.dataUltimaAcaoCliente ? new Date(a.dataUltimaAcaoCliente).getTime() : 0;
      const db = b.dataUltimaAcaoCliente ? new Date(b.dataUltimaAcaoCliente).getTime() : 0;
      return db - da;
    }
    if(ordem === 'cutucada-recente'){
      const ca = parseCutucada_(a.cutucada);
      const cb = parseCutucada_(b.cutucada);
      const ta = ca ? ca.timestamp : 0;
      const tb = cb ? cb.timestamp : 0;
      return tb - ta;
    }
    if(ordem === 'cutucada-antiga'){
      const ca = parseCutucada_(a.cutucada);
      const cb = parseCutucada_(b.cutucada);
      const ta = ca ? ca.timestamp : Number.MAX_SAFE_INTEGER;
      const tb = cb ? cb.timestamp : Number.MAX_SAFE_INTEGER;
      return ta - tb;
    }
    if(ordem === 'sem-cutucada'){
      const ca = parseCutucada_(a.cutucada);
      const cb = parseCutucada_(b.cutucada);
      if(!ca && cb) return -1;
      if(ca && !cb) return 1;
      return 0;
    }
    return 0;
  });
  if(arr.length === 0){
    lista.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  lista.innerHTML = arr.map(c => clienteRowHTML(c)).join('');
}

async function abrirCutucadas(telefone){

  if(!tel){ toast('Telefone inválido', 'error'); return; }
  const cli = state.clientes.find(c => normalizaTel(c.telefone) === tel);
  const nome = cli ? (cli.nome || '') : '';
  window._cutucadaTelAtual = tel;
  $('cutucadasNome').textContent = nomeCompletoCliente_(nome, tel);
  $('cutucadasSub').textContent = fmtTel(tel);
  $('cutucadaNovaTexto').value = '';
  $('cutucadaLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando cutucadas...</p></div>';
  $('cutucadasBackdrop').classList.add('show');
  marcarSalvando(true);
  const res = await api('listarCutucadas', { senha: state.adminSenha, telefone: tel });

  if(!res.ok){
    $('cutucadaLista').innerHTML = '<div class="empty-state"><p>Erro ao carregar cutucadas</p></div>';

  const lista = res.data || [];

function renderizarListaCutucadas_(lista){
  window._cutucadasAtuais = lista || [];

    cont.innerHTML = '<div class="empty-state" style="padding:30px 20px;"><p>Nenhuma cutucada registrada ainda.</p></div>';

  }

        <span class="cut-data">📣 ${esc(dataFmt)}</span>

        <div class="cut-acoes">
          <button class="btn btn-ghost btn-xs" onclick="abrirEdicaoCutucada('${esc(c.id)}')">
            <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

        </div>

            <button class="btn btn-primary btn-xs" onclick="salvarEdicaoCutucada('${esc(c.id)}')">Salvar</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}
function abrirEdicaoCutucada(id){
  const wrap = $('cut-edit-' + id);
  const texto = $('cut-text-' + id);
  if(!wrap || !texto) return;
  wrap.classList.remove('hidden');
  texto.style.display = 'none';
  const input = $('cut-edit-input-' + id);
  if(input) input.focus();
}
function cancelarEdicaoCutucada(id){
  const wrap = $('cut-edit-' + id);
  const texto = $('cut-text-' + id);
  if(wrap) wrap.classList.add('hidden');
  if(texto) texto.style.display = '';
}
async function salvarEdicaoCutucada(id){
  const input = $('cut-edit-input-' + id);
  if(!input) return;
  const novoTexto = input.value.trim();
  if(!novoTexto){ toast('Escreva algo', 'error'); return; }
  marcarSalvando(true);
  const res = await api('atualizarCutucada', { senha: state.adminSenha, id: id, texto: novoTexto });
  marcarSalvando(false);
  if(!res.ok){ toast(res.error || 'Erro ao salvar cutucada', 'error'); return; }
  toast('Cutucada atualizada ✅', 'success');
  const lista = window._cutucadasAtuais || [];
  const item = lista.find(c => c.id === id);
  if(item) item.texto = novoTexto;
  const textoEl = $('cut-text-' + id);
  if(textoEl) textoEl.textContent = novoTexto;
  cancelarEdicaoCutucada(id);
  atualizarUltimaCutucadaDoCliente_(id, novoTexto);
  renderizarClientes();
}
function atualizarUltimaCutucadaDoCliente_(idCutucada, novoTexto){
  const telAtual = window._cutucadaTelAtual;
  if(!telAtual) return;
  const c = state.clientes.find(x => normalizaTel(x.telefone) === telAtual);
  if(!c) return;
  const lista = window._cutucadasAtuais || [];
  if(lista.length === 0) return;
  const maisRecente = lista[0];
  c.cutucada = maisRecente.dataHora + '|' + maisRecente.texto;
}
function fecharCutucadas(){
  $('cutucadasBackdrop').classList.remove('show');
  window._cutucadaTelAtual = null;
  window._cutucadasAtuais = [];
}
async function salvarNovaCutucada(){
  const tel = window._cutucadaTelAtual;
  if(!tel){ toast('Telefone não identificado', 'error'); return; }
  const texto = ($('cutucadaNovaTexto').value || '').trim();
  if(!texto){ toast('Escreva a cutucada', 'error'); return; }
  const btn = $('btnSalvarCutucada');
  if(btn) btn.disabled = true;
  marcarSalvando(true);
  const res = await api('adicionarCutucada', { senha: state.adminSenha, telefone: tel, texto: texto });
  marcarSalvando(false);
  if(btn) btn.disabled = false;
  if(!res.ok){ toast(res.error || 'Erro ao salvar cutucada', 'error'); return; }
  const cli = state.clientes.find(c => normalizaTel(c.telefone) === tel);
  if(cli){ cli.cutucada = res.dataHora + '|' + texto; }
  const item = { id: res.id, telefone: tel, texto: texto, dataHora: res.dataHora, origem: 'admin', apelido: 'admin' };
  const listaAtual = window._cutucadasAtuais || [];
  listaAtual.unshift(item);
  renderizarListaCutucadas_(listaAtual);
  $('cutucadaNovaTexto').value = '';

}

  const totalAcoes = eventos.filter(e => e.tipo === 'acao').length;

  const diasUlt = ultimoEvento ? diasAtras(ultimoEvento.dataHora) : null;

  $('ativResumo').innerHTML = `
    <div class="ativ-card">
      <span class="lbl">Engajamento</span>
      <span class="val ${nivelClass}">${nivelTxt}</span>
      <span class="sub">${diasUlt !== null ? 'Última ação: ' + (diasUlt === 0 ? 'hoje' : diasUlt + ' dia(s) atrás') : 'Sem registro'}</span>

    <div class="ativ-card">
      <span class="lbl">Total de acessos</span>

      <span class="lbl">Total de ações</span>

      <span class="sub">marcações, visitas, edições</span>

      <span class="val" style="font-size:.78rem;">${ultimoEvento ? fmtDataHoraCurta(ultimoEvento.dataHora) : '—'}</span>
      <span class="sub">${ultimoEvento ? esc(ultimoEvento.titulo) : ''}</span>

function setFiltroAtividade(filtro, btn){
  state._atividadeFiltro = filtro;

  if(btn) btn.classList.add('active');
  renderizarTimeline();
}
function renderizarTimeline(){
  const container = $('ativTimeline');
  if(!container) return;
  let eventos = state._atividadeEventos || [];
  if(state._atividadeFiltro === 'acessos') eventos = eventos.filter(e => e.tipo === 'acesso');
  else if(state._atividadeFiltro === 'cliente') eventos = eventos.filter(e => e.tipo === 'acao' && !e.isAdmin);
  else if(state._atividadeFiltro === 'admin') eventos = eventos.filter(e => e.tipo === 'acao' && e.isAdmin);
  if(eventos.length === 0){
    container.innerHTML = '<div class="empty-state"><p>Nenhum registro nesse filtro</p></div>';
    return;
  }
  container.innerHTML = eventos.map(e => {
    let dotClass = '', icon = '';
    if(e.tipo === 'acesso'){
      if(e.isAdmin){ dotClass = 'login-admin'; icon = '🛡️'; }
      else { dotClass = 'login-cliente'; icon = '🔐'; }
    } else {
      if(e.isAdmin){ dotClass = 'acao-admin'; icon = '👤'; }
      else { dotClass = 'acao-cliente'; icon = '✅'; }

    return `
      <div class="timeline-item">

  }).join('');
}

async function carregarAgenda(mostrarLoading){
  if(mostrarLoading){
    $('agendaLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando agenda...</p></div>';
  }
  const [res, resIm, resEv] = await Promise.all([
    api('listarAgendamentos', { senha: state.adminSenha }),
    api('listarTodosImoveis', { senha: state.adminSenha }),
    api('listarEventosNeutros', { senha: state.adminSenha })
  ]);
  state.agendamentos = (res.ok && res.data) ? res.data : [];
  state.eventosNeutros = (resEv.ok && resEv.data) ? resEv.data : [];
  if(resIm.ok && resIm.data){
    state.todosImoveis = resIm.data;
    state._corretorPorImovelId = {};
    state.todosImoveis.forEach(im => {
      state._corretorPorImovelId[String(im.id)] = im.corretor || '';
    });
  }
  state.carregado.agenda = true;
  atualizarBalAgenda();
  renderizarFiltrosAgenda();
  renderizarAgenda();
  renderizarCorretoresNoCardAgenda_();
}
function renderizarCorretoresNoCardAgenda_(){
  const wrap = $('agendaCorretoresLista');
  if(!wrap) return;
  const lista = [...state.agendamentos, ...state.eventosNeutros];
  const contagem = {};
  lista.forEach(a => {
    const corr = resolverCorretor_(a) || '(sem corretor)';
    if(!contagem[corr]) contagem[corr] = 0;
    contagem[corr]++;
  });
  const entradas = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
  if(entradas.length === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = entradas.map(([nome, qtd]) => {
    const cor = corDoCorretor(nome) || '#94a3b8';
    return `
      <div class="linha-corr">
        <span class="nome-corr">
          <span class="dot-corr" style="background:${cor};"></span>
          ${esc(nome)}
        </span>
        <span class="num-corr">${qtd}</span>
      </div>
    `;
  }).join('');
}
function atualizarBalAgenda(){
  const el = $('balAgenda');
  if(!el) return;
  const total = (state.agendamentos.length + state.eventosNeutros.length);
  el.textContent = total > 99 ? '99+' : total;
  el.classList.toggle('zero', total === 0);
}
function renderizarFiltrosAgenda(){
  const wrap = $('filtrosAgenda');
  if(!wrap) return;
  const todos = [...state.agendamentos, ...state.eventosNeutros];
  const total = todos.length;
  const todosAtivo = state.filtrosAgenda.size === 0 ? 'active' : '';
  const corretoresEncontrados = new Set();
  todos.forEach(a => {
    const c = chaveCorretorExata_(resolverCorretor_(a));
    if(c) corretoresEncontrados.add(c);
  });
  const listaCorretores = [...corretoresEncontrados].sort((a,b) => a.localeCompare(b,'pt-BR'));
  const chips = listaCorretores.map(nome => {
    const cnt = todos.filter(a => chaveCorretorExata_(resolverCorretor_(a)) === nome).length;
    const ativo = state.filtrosAgenda.has(nome);
    const cor = corDoCorretor(nome) || '#64748b';
    return `<button class="chip chip-corretor ${ativo ? 'active' : ''}"
              style="background:${ativo ? cor : '#fff'}; color:${ativo ? '#fff' : cor}; border-color:${cor}"
              onclick="toggleFiltroAgenda('${esc(nome)}')">
              ${esc(nome)} <span class="cnt">${cnt}</span>
            </button>`;
  }).join('');
  wrap.innerHTML = `
    <div class="filtro-grupo">
      <button class="chip ${todosAtivo}" onclick="limparFiltroAgenda()">Todos <span class="cnt">${total}</span></button>
      ${chips}
    </div>
  `;
}
function toggleFiltroAgenda(nome){
  if(state.filtrosAgenda.has(nome)) state.filtrosAgenda.delete(nome);
  else state.filtrosAgenda.add(nome);
  renderizarFiltrosAgenda();
  renderizarAgenda();
}
function limparFiltroAgenda(){
  state.filtrosAgenda.clear();
  renderizarFiltrosAgenda();
  renderizarAgenda();
}
function renderizarAgenda(){
  const lista = $('agendaLista');
  // Junta os dois tipos
  let arr = [
    ...state.agendamentos.map(a => {
      if(a.corretor) return a;
      return { ...a, corretor: resolverCorretor_(a) };
    }),
    ...state.eventosNeutros.map(e => ({ ...e, _isEventoNeutro: true }))
  ];
  if(state.filtrosAgenda.size > 0){
    arr = arr.filter(a => state.filtrosAgenda.has(chaveCorretorExata_(resolverCorretor_(a))));
  }
  arr.sort((a, b) => new Date(a.dataVisitaAgendada) - new Date(b.dataVisitaAgendada));
  const conflitos = calcularConflitos_(arr);
  if(arr.length === 0){
    lista.innerHTML = `
      <div class="empty-state">
        <svg class="empty-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <h3>Nenhuma visita agendada</h3>
        <p>Sem agendamentos no momento.</p>
      </div>
    `;
    return;
  }
  lista.innerHTML = arr.map(a => agendaRowHTML(a, conflitos[a.id])).join('');
}
function agendaRowHTML(a, conflito){
  const quando = classificarAgendamento(a.dataVisitaAgendada);

    const corCorrEv = a.corretor ? corDoCorretor(a.corretor) : '#64748b';
    return `
      <div class="agenda-row-v2 evento" data-id="${id}">
        <div class="cabecalho">

async function salvarEvento(ev){
  const idEvento = $('eventoId').value || '';
  const titulo = $('eventoTitulo').value.trim();
  const descricao = $('eventoDescricao').value.trim();
  const dataHora = $('eventoDataHora').value;
  const corretor = $('eventoCorretor').value;
  if(!titulo){ toast('Informe o título do evento', 'error'); return; }
  if(!dataHora){ toast('Informe a data e hora', 'error'); return; }
  if(!corretor){ toast('Escolha o corretor', 'error'); return; }
  const dataEscolhida = new Date(dataHora);
  const agora = new Date();
  const hojeZero = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
  const dataZero = new Date(dataEscolhida.getFullYear(), dataEscolhida.getMonth(), dataEscolhida.getDate());
  if(dataZero < hojeZero){ toast('Não é possível criar evento em datas passadas', 'error'); return; }
  const btn = ev?.target; if(btn) btn.disabled = true;
  marcarSalvando(true);
  const iso = dataEscolhida.toISOString();
  let res;
  if(idEvento){
    res = await api('atualizarEventoNeutro', {
      senha: state.adminSenha, id: idEvento,
      titulo, descricao, dataHora: iso, corretor
    });
  } else {
    res = await api('criarEventoNeutro', {
      senha: state.adminSenha,
      titulo, descricao, dataHora: iso, corretor
    });
  }
  marcarSalvando(false);
  if(btn) btn.disabled = false;
  if(!res.ok){ toast(res.error || 'Erro ao salvar evento', 'error'); return; }
  toast(idEvento ? 'Evento atualizado' : 'Evento criado', 'success');
  fecharEventoModal();
  state.carregado.agenda = false;
  await carregarAgenda(false);
}

function zapConfirmarVisita(){
  const id = window._zapAgendamentoId;
  if(!id){ fecharModalWhatsAppAgenda(); return; }
  const a = state.agendamentos.find(x => x.id === id);
  if(!a){ fecharModalWhatsAppAgenda(); return; }
  const cli = state.clientes.find(c => normalizaTel(c.telefone) === normalizaTel(a.telefone));
  const nomeCliente = (cli && cli.nome) || a.clienteNome || '';
  const pNome = primeiroNome_(nomeCliente);
  const dt = new Date(a.dataVisitaAgendada);
  const dia = String(dt.getDate()).padStart(2,'0');
  const mes = String(dt.getMonth()+1).padStart(2,'0');
  const ano = dt.getFullYear();
  const ds = DIAS_SEMANA[dt.getDay()];
  const hora = String(dt.getHours()).padStart(2,'0');
  const min = String(dt.getMinutes()).padStart(2,'0');
  const campos = camposEndereco_(a);
  const endereco = campos.rua || (a.titulo || '').split(',')[0] || '';
  const numero = campos.numero || '';
  const bairro = campos.bairro || '';
  let msg = `Ei ${pNome}, estou passando para confirmar nossa visita `;
  msg += `dia ${dia}/${mes}/${ano} (${ds}) às ${hora}:${min}hs`;
  if(endereco) msg += ` na rua ${endereco}`;
  if(numero) msg += `, número ${numero}`;
  if(bairro) msg += ` bairro ${bairro}`;
  msg += `.`;
  const tel = normalizaTel(a.telefone);
  const telZap = tel.startsWith('55') ? tel : '55' + tel;
  window.open(`https://wa.me/${telZap}?text=${encodeURIComponent(msg)}`, '_blank');
  fecharModalWhatsAppAgenda();
}

function desenharTextoMultilinha(ctx, texto, x, y, maxWidth, lineHeight, maxLinhas){
  const palavras = String(texto).split(' ');
  let linha = '';
  let linhas = 0;
  for(let i = 0; i < palavras.length; i++){
    const teste = linha ? linha + ' ' + palavras[i] : palavras[i];
    const largura = ctx.measureText(teste).width;
    if(largura > maxWidth && linha){
      ctx.fillText(linha, x, y + linhas * lineHeight);
      linhas++;
      if(maxLinhas && linhas >= maxLinhas) return;
      linha = palavras[i];
    } else {
      linha = teste;
    }
  }
  if(linha) ctx.fillText(linha, x, y + linhas * lineHeight);
}
function gerarCartaoVisitaDataURL(im){
  const W = 1200, H = 630;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#fef2f2');
  grad.addColorStop(1, '#fde8e8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#d9534f';
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, W - 8, H - 8);
  ctx.fillStyle = '#d9534f';
  ctx.fillRect(0, 0, 16, H);
  ctx.fillStyle = '#b91c1c';
  ctx.font = 'bold 44px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('VISITA CONFIRMADA', 70, 60);
  ctx.strokeStyle = '#fca5a5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(70, 130); ctx.lineTo(W - 70, 130);
  ctx.stroke();
  ctx.fillStyle = '#7f1d1d';
  ctx.font = 'bold 54px -apple-system, "Segoe UI", Roboto, sans-serif';
  desenharTextoMultilinha(ctx, im.titulo || 'Endereço não informado', 70, 180, W - 140, 66, 2);
  if(im.codigo){
    ctx.fillStyle = '#4a3d6b';
    ctx.font = 'bold 42px "Courier New", monospace';
    ctx.fillText('#' + im.codigo, 70, 400);
  }
  ctx.fillStyle = '#b91c1c';
  ctx.font = 'bold 48px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(fmtDataHoraCurta(im.dataVisitaAgendada), 70, H - 130);
  return canvas.toDataURL('image/png');
}

async function carregarNotificacoes(mostrarLoading){
  if(mostrarLoading){
    if(state.painelAtivo === 'visitar'){
      $('visitarLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando...</p></div>';
    } else if(state.painelAtivo === 'gostei'){
      $('gosteiLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando...</p></div>';
    }
  }
  if(!state.carregado.clientes) await carregarClientes(false);
  const res = await api('listarNotificacoes', { senha: state.adminSenha });
  state.notificacoes = (res.ok && res.data) ? res.data : { gostei: [], visita: [] };

  state.carregado.gostei = true;

function atualizarBalGostei(){

  if(!el) return;

      grupos[tel] = { telefone: tel, clienteNome: item.clienteNome, corretor: item.corretor, imoveis: [] };

function renderizarConcluidasNoPainel(container, tipo){
  if(!state.todosImoveis.length){
    container.innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando concluídas...</p></div>';
    api('listarTodosImoveis', { senha: state.adminSenha }).then(res => {
      state.todosImoveis = (res.ok && res.data) ? res.data : [];
      renderizarConcluidasNoPainel(container, tipo);
    });
    return;
  }
  const concluidas = [];
  state.todosImoveis.forEach(im => {
    const status = String(im.status || '').toLowerCase();
    if(tipo === 'gostei'){
      if(status === 'gostei' && String(im.atendidoGostei||'').toLowerCase() === 'sim'){
        concluidas.push({ ...im, tipoConcluida: 'gostei', motivo: 'Marcada como tratada' });
      }
    } else {
      const atendidoV = String(im.atendidoVisita||'').toLowerCase() === 'sim';
      const temAgendamento = !!im.dataVisitaAgendada;
      const visitaFeita = String(im.visitaFeita||'').toLowerCase() === 'sim';
      if(status === 'quero-visitar' && (atendidoV || temAgendamento || visitaFeita)){
        let motivo = 'Marcada como tratada';
        if(visitaFeita) motivo = 'Visita registrada em ' + fmtData(im.dataVisita);
        else if(temAgendamento) motivo = 'Agendada para ' + fmtDataHora(im.dataVisitaAgendada);
        concluidas.push({ ...im, tipoConcluida: 'visita', motivo });
      }
    }
  });
  concluidas.sort((a, b) => new Date(b.dataCadastro||0) - new Date(a.dataCadastro||0));
  if(concluidas.length === 0){
    container.innerHTML = `<div class="empty-state"><h3>Nenhuma concluída ainda.</h3></div>`;
    return;

  container.innerHTML = concluidas.map(item => concluidaRowHTML(item)).join('');

async function marcarTratado(imovelId, tipo){

  });

  const res = await api('marcarAtendido', {
    senha: state.adminSenha, id: imovelId, tipo: tipo, atendido: true
  });

  state.todosImoveis = [];
  await carregarNotificacoes(false);
}

/* =====================================================
   REFRESH SILENCIOSO
===================================================== */
function iniciarRefreshSilencioso(){
  pararRefreshSilencioso();
  const resetTimer = () => {
    if(state._refreshTimer) clearTimeout(state._refreshTimer);
    state._refreshTimer = setTimeout(() => {
      if(!state.isAdmin) return;
      if(estaSalvando()){ resetTimer(); return; }
      executarRefreshSilencioso();
    }, 15 * 60 * 1000);
  };
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(evt => {
    document.addEventListener(evt, resetTimer, { passive: true });
  });
  resetTimer();
}
function pararRefreshSilencioso(){
  if(state._refreshTimer){
    clearTimeout(state._refreshTimer);
    state._refreshTimer = null;
  }
}
async function executarRefreshSilencioso(){
  if(state._refreshEmAndamento) return;
  if(estaSalvando()) return;
  if(!state.isAdmin) return;
  state._refreshEmAndamento = true;
  try {
    const [resCli, resAg, resNot, resCor, resTar, resEv] = await Promise.all([
      api('listarClientes', { senha: state.adminSenha }),
      api('listarAgendamentos', { senha: state.adminSenha }),
      api('listarNotificacoes', { senha: state.adminSenha }),
      api('listarCorrecoes', { senha: state.adminSenha }),
      api('listarTarefas', { senha: state.adminSenha }),
      api('listarEventosNeutros', { senha: state.adminSenha })
    ]);
    if(estaSalvando()){ state._refreshEmAndamento = false; return; }
    if(resCli.ok && resCli.data) state.clientes = resCli.data;
    if(resAg.ok && resAg.data) state.agendamentos = resAg.data;
    if(resNot.ok && resNot.data) state.notificacoes = resNot.data;
    if(resCor.ok && resCor.data) state.correcoes = resCor.data;
    if(resTar.ok && resTar.data) state.tarefas = resTar.data;
    if(resEv.ok && resEv.data) state.eventosNeutros = resEv.data;
    const emModal = document.querySelector('.modal-backdrop.show, .modal-obs');

        clientes: []
      };
    }
    const cli = state.clientes.find(c => normalizaTel(c.telefone) === normalizaTel(im.telefone));
    grupos[chave].clientes.push({
      telefone: im.telefone,
      nome: cli ? cli.nome : (im.clienteNome || '(sem cadastro)'),
      corretor: (cli && cli.corretor) || im.corretor || '',

let _buscaGeralTimer = null;
function onBuscaGeralChanged(){
  clearTimeout(_buscaGeralTimer);
  _buscaGeralTimer = setTimeout(() => renderizarListaGeral(), 250);
}
function renderizarFiltrosGeralStatus(){
  const wrap = $('filtrosGeralStatus');
  if(!wrap) return;
  const cnt = { todos: 0, pendente: 0, gostei: 0, 'quero-visitar': 0, 'nao-gostei': 0 };
  (state.gruposImoveis || []).forEach(g => {
    cnt.todos++;
    const s = g.status || 'pendente';
    if(cnt[s] !== undefined) cnt[s]++;
    else cnt.pendente++;
  });
  const opts = [
    ['todos', 'Todos', cnt.todos],
    ['pendente', 'Aguardando', cnt.pendente],
    ['quero-visitar', 'Visitar', cnt['quero-visitar']],
    ['gostei', 'Gostei', cnt.gostei],
    ['nao-gostei', 'Não gostei', cnt['nao-gostei']]
  ];
  wrap.innerHTML = `
    <div class="filtro-grupo">
      <span class="lbl">Status:</span>
      ${opts.map(([v, l, n]) => `
        <button class="chip ${state.filtrosGeralStatus.has(v) || (v === 'todos' && state.filtrosGeralStatus.size === 0) ? 'active' : ''}"
                onclick="toggleFiltroGeralStatus('${v}')">${l} <span class="cnt">${n}</span></button>
      `).join('')}
    </div>
  `;
}
function toggleFiltroGeralStatus(v){
  if(v === 'todos'){ state.filtrosGeralStatus.clear(); }
  else {
    if(state.filtrosGeralStatus.has(v)) state.filtrosGeralStatus.delete(v);
    else state.filtrosGeralStatus.add(v);
  }
  renderizarFiltrosGeralStatus();
  renderizarListaGeral();
}
function renderizarListaGeral(){
  const wrap = $('listaGeralImoveis');
  if(!wrap) return;
  const busca = ($('buscaGeral').value || '').toLowerCase().trim();
  const ordem = $('ordenacaoGeral').value;
  let arr = [...(state.gruposImoveis || [])];
  if(state.filtrosGeralStatus.size > 0){
    arr = arr.filter(g => {
      const s = g.status || 'pendente';
      return state.filtrosGeralStatus.has(s);
    });
  }
  if(busca){
    const b = busca;
    const bNum = normalizaTel(busca);
    arr = arr.filter(g => {
      if((g.titulo || '').toLowerCase().includes(b)) return true;
      if((g.rua || '').toLowerCase().includes(b)) return true;
      if((g.bairro || '').toLowerCase().includes(b)) return true;
      if((g.numero || '').toLowerCase().includes(b)) return true;
      if((g.codigo || '').toLowerCase().includes(b)) return true;
      if(g.clientes.some(c => (c.nome || '').toLowerCase().includes(b))) return true;
      if(bNum && g.clientes.some(c => normalizaTel(c.telefone).includes(bNum))) return true;
      return false;
    });
  }
  arr.sort((a, b) => {
    if(ordem === 'alfabetica') return (a.titulo||'').localeCompare(b.titulo||'', 'pt-BR', {sensitivity:'base'});
    if(ordem === 'preco'){
      const pa = parseFloat(String(a.preco||'0').replace(/\D/g,'')) || 0;
      const pb = parseFloat(String(b.preco||'0').replace(/\D/g,'')) || 0;
      return pa - pb;
    }
    if(ordem === 'clientes') return b.clientes.length - a.clientes.length;
    return 0;
  });
  if(arr.length === 0){
    wrap.innerHTML = '<div class="empty-state"><h3>Nenhum imóvel encontrado</h3></div>';
    return;
  }
  wrap.innerHTML = arr.map(g => grupoImovelHTML(g)).join('');
}
function grupoImovelHTML(g){
  const enderecoCompleto = [g.rua, g.numero].filter(Boolean).join(', ') + (g.bairro ? ' - ' + g.bairro : '');
  const link = String(g.link || '').trim();
  const codigo = String(g.codigo || '').trim();
  const buscareUrl = codigo ? `${BUSCAR_BASE}/${codigo}` : '';
  const clientesUnicos = {};
  g.clientes.forEach(c => {
    const tel = normalizaTel(c.telefone);
    if(!clientesUnicos[tel]) clientesUnicos[tel] = c;
  });
  const chipsClientes = Object.values(clientesUnicos).map(c => {
    const corC = c.corretor ? corDoCorretor(c.corretor) : '';
    return `
      <button class="cliente-chip" onclick="fecharListaGeral(); abrirVitrineAdminDoCard('${esc(c.telefone)}')" title="Abrir vitrine admin de ${esc(c.nome)}">
        ${esc(c.nome || 'Sem nome')}
        ${corC ? `<span class="tel-cli" style="color:${corC}; font-weight:700;">${esc(c.corretor)}</span>` : ''}
        <span class="tel-cli">${esc(fmtTel(c.telefone))}</span>
      </button>
    `;
  }).join('');
  return `
    <div class="agenda-row-v2" style="border-left-color:var(--primary);">
      <div class="cabecalho">
        <div class="info">
          <div class="cliente">
            ${esc(enderecoCompleto || g.titulo || 'Sem endereço')}
            ${codigo ? `<span class="codigo">#${esc(codigo)}</span>` : ''}
            ${g.preco ? `<span class="corretor-badge" style="background:var(--success)">${esc(g.preco)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${buscareUrl ? `<button class="btn btn-ghost btn-xs" onclick="window.open('${esc(buscareUrl)}','_blank','noopener')">Entrada</button>` : ''}
          ${link ? `<button class="btn btn-primary btn-xs" onclick="window.open('${esc(link)}','_blank','noopener')">Anúncio</button>` : ''}
        </div>
      </div>
      <div class="barra-acoes" style="display:flex; gap:6px; flex-wrap:wrap; padding-top:8px;">
        <span style="font-size:.68rem; font-weight:700; color:var(--muted); text-transform:uppercase; align-self:center;">Clientes (${Object.keys(clientesUnicos).length}):</span>
        ${chipsClientes || '<span style="color:var(--muted); font-size:.72rem;">Nenhum</span>'}
      </div>
    </div>
  `;
}

/* =====================================================
   COPIAR
===================================================== */
function copiarTexto(texto){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texto)
      .then(() => toast('Texto copiado! Cole no WhatsApp', 'success'))
      .catch(() => fallbackCopy(texto));
  } else fallbackCopy(texto);
}
function fallbackCopy(texto){
  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Texto copiado!', 'success'); }
  catch(e){ toast('Não foi possível copiar', 'error'); }
  document.body.removeChild(ta);
}

/* =====================================================
   ✅ CAPTAÇÕES QPREÇO — NOVAS FUNCIONALIDADES
===================================================== */
const CAPTACOES_STATE = {
  lista: [],
  filtro: 'pendentes',
  filtroContato: 'todos',
  filtrosCorretores: new Set(),
  carregado: false
};

async function atualizarBadgeCaptar(){
  try {
    const res = await api('contarCaptacoesPendentes', {});
    if(res && res.ok){
      const num = $('captarBadgeNum');
      if(!num) return;
      const pendentes = res.pendentes || 0;
      num.textContent = pendentes > 99 ? '99+' : pendentes;
      num.style.display = pendentes > 0 ? 'inline-block' : 'none';
    }
  } catch(e){
    console.warn('[atualizarBadgeCaptar] erro:', e);
  }
}

async function abrirCaptacoes(){
  $('captacoesBackdrop').classList.add('show');
  $('captacoesLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando captações...</p></div>';
  await carregarCaptacoes(true);
}

function fecharCaptacoes(){
  $('captacoesBackdrop').classList.remove('show');
}

function setFiltroCaptacoes(filtro, btn){
  CAPTACOES_STATE.filtro = filtro;
  const wrap = btn ? btn.closest('.filtro-grupo') : null;
  if(wrap){
    wrap.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }
  renderizarCaptacoes();
}

function setFiltroCaptacoesContato(filtro, btn){
  CAPTACOES_STATE.filtroContato = filtro;
  const wrap = btn ? btn.closest('.filtro-grupo') : null;
  if(wrap){
    wrap.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }
  renderizarCaptacoes();
}

function toggleFiltroCaptacaoCorretor(nome){
  if(CAPTACOES_STATE.filtrosCorretores.has(nome)) CAPTACOES_STATE.filtrosCorretores.delete(nome);
  else CAPTACOES_STATE.filtrosCorretores.add(nome);
  renderizarFiltroCaptacoesCorretores();
  renderizarCaptacoes();
}

function limparFiltroCaptacaoCorretores(){
  CAPTACOES_STATE.filtrosCorretores.clear();
  renderizarFiltroCaptacoesCorretores();
  renderizarCaptacoes();
}

function renderizarFiltroCaptacoesCorretores(){
  const wrap = $('captacoesFiltroCorretores');
  if(!wrap) return;
  const lista = CAPTACOES_STATE.lista || [];
  const encontrados = new Set();
  lista.forEach(c => {
    const nome = String(c.atendidoPor || '').trim();
    if(nome) encontrados.add(nome);
  });
  // Se não houver nenhum com atendidoPor, mostra os corretores fixos
  const listaCorretores = encontrados.size > 0
    ? [...encontrados].sort((a,b) => a.localeCompare(b,'pt-BR'))
    : state.corretores.map(c => c.nome);

  const chips = listaCorretores.map(nome => {
    const cnt = lista.filter(c => String(c.atendidoPor || '').trim() === nome).length;
    const ativo = CAPTACOES_STATE.filtrosCorretores.has(nome);
    const cor = corDoCorretor(nome) || '#64748b';
    return `<button class="chip chip-corretor ${ativo ? 'active' : ''}"
              style="background:${ativo ? cor : '#fff'}; color:${ativo ? '#fff' : cor}; border-color:${cor}"
              onclick="toggleFiltroCaptacaoCorretor('${esc(nome)}')">
              ${esc(nome)} <span class="cnt">${cnt}</span>
            </button>`;
  }).join('');
  wrap.innerHTML = `
    <span class="lbl">Corretor:</span>
    <button class="chip ${CAPTACOES_STATE.filtrosCorretores.size === 0 ? 'active' : ''}" onclick="limparFiltroCaptacaoCorretores()">Todos</button>
    ${chips}
  `;
}

async function carregarCaptacoes(mostrarLoading){
  if(mostrarLoading){
    $('captacoesLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando captações...</p></div>';
  }
  marcarSalvando(true);
  const res = await api('listarCaptacoesQPrecoV2', { senha: state.adminSenha });
  marcarSalvando(false);
  if(!res.ok){
    $('captacoesLista').innerHTML = '<div class="empty-state"><p>Erro ao carregar captações</p></div>';
    return;
  }
  CAPTACOES_STATE.lista = res.data || [];
  CAPTACOES_STATE.carregado = true;
  renderizarFiltroCaptacoesCorretores();
  renderizarCaptacoes();
  atualizarBadgeCaptar();
}

function renderizarCaptacoes(){
  const container = $('captacoesLista');
  const resumo = $('captacoesResumo');
  if(!container) return;
  const todas = CAPTACOES_STATE.lista || [];
  const pendentes = todas.filter(c => String(c.concluida || '').trim().toLowerCase() !== 'sim');
  const concluidas = todas.filter(c => String(c.concluida || '').trim().toLowerCase() === 'sim');
  if(resumo){
    resumo.textContent = `(${pendentes.length} pendente${pendentes.length === 1 ? '' : 's'} · ${concluidas.length} concluída${concluidas.length === 1 ? '' : 's'})`;
  }
  let arr = todas;
  if(CAPTACOES_STATE.filtro === 'pendentes') arr = pendentes;
  else if(CAPTACOES_STATE.filtro === 'concluidas') arr = concluidas;

  // Filtro de contato
  if(CAPTACOES_STATE.filtroContato === 'sem-retorno'){
    arr = arr.filter(c => String(c.contatoFeito || '').trim().toLowerCase() === 'sem-retorno');
  } else if(CAPTACOES_STATE.filtroContato === 'nao-contatado'){
    arr = arr.filter(c => !String(c.contatoFeito || '').trim());
  }

  // Filtro de corretores
  if(CAPTACOES_STATE.filtrosCorretores.size > 0){
    arr = arr.filter(c => CAPTACOES_STATE.filtrosCorretores.has(String(c.atendidoPor || '').trim()));
  }

  if(arr.length === 0){
    container.innerHTML = `
      <div class="empty-state" style="padding:40px 20px;">
        <h3>${CAPTACOES_STATE.filtro === 'pendentes' ? 'Nenhuma captação pendente 🎉' : 'Nenhuma captação nesse filtro'}</h3>
        <p>${CAPTACOES_STATE.filtro === 'pendentes' ? 'Você está em dia!' : 'Tente outro filtro.'}</p>
      </div>`;
    return;
  }
  container.innerHTML = arr.map(c => captacaoRowHTML(c)).join('');
}

function captacaoRowHTML(c){
  const isConcluida = String(c.concluida || '').trim().toLowerCase() === 'sim';
  const tel = normalizaTel(c.telefone);
  const telFmt = fmtTel(tel);
  const telZap = tel.startsWith('55') ? tel : '55' + tel;
  const endereco = [c.rua, c.numero, c.complemento].filter(Boolean).join(', ');
  const dataHora = c.dataHora ? fmtDataHora(c.dataHora) : '—';

  const contatoFeito = String(c.contatoFeito || '').trim();
  let statusContato = 'nao-contatado';
  if(contatoFeito.toLowerCase() === 'sem-retorno') statusContato = 'sem-retorno';
  else if(contatoFeito) statusContato = 'contatado';

  const atendidoPor = String(c.atendidoPor || '').trim();

  // Select de contato
  const opcoesContato = [
    { v: '', l: '— Não contatado —' },
    ...state.corretores.map(cr => ({ v: cr.nome, l: '✅ ' + cr.nome + ' (contatou)' })),
    { v: 'sem-retorno', l: '❌ Sem retorno' }
  ];
  const selectContatoHTML = opcoesContato.map(op => 
    `<option value="${esc(op.v)}" ${contatoFeito === op.v ? 'selected' : ''}>${esc(op.l)}</option>`
  ).join('');

  return `
    <div class="agenda-row-v2" data-id="${esc(c.id)}" style="border-left-color:${isConcluida ? 'var(--success)' : statusContato === 'sem-retorno' ? 'var(--danger)' : statusContato === 'contatado' ? 'var(--info)' : 'var(--warn)'}; ${isConcluida ? 'opacity:.75;' : ''}">
      <div class="cabecalho">
        <div class="quando ${isConcluida ? 'semana' : 'amanha'}" style="font-size:.68rem;">
          ${isConcluida ? '✅ Concluída' : '⏳ Pendente'}
        </div>
        <div class="info">
          <div class="cliente">
            ${esc(c.nome || '(sem nome)')}
            <span class="tel">
              <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              ${esc(telFmt)}
            </span>
            ${atendidoPor ? `<span class="corretor-badge" style="background:${corDoCorretor(atendidoPor) || '#64748b'}">${esc(atendidoPor)}</span>` : ''}
            <span class="captacao-status-tag ${statusContato}">
              ${statusContato === 'sem-retorno' ? '❌ Sem retorno' : statusContato === 'contatado' ? '✅ Contatado' : '⚪ Não contatado'}
            </span>
          </div>
          <div class="detalhe">
            <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            ${esc(endereco || '(endereço incompleto)')}
            ${c.bairro ? ` · <strong>${esc(c.bairro)}</strong>` : ''}
          </div>
          <div class="detalhe" style="font-size:.68rem; color:var(--muted);">
            📅 ${esc(dataHora)} ${c.navegador ? `· ${esc(c.navegador)}` : ''}
          </div>
        </div>
      </div>

      <!-- Contato + observações -->
      <div class="captacao-contato-wrap">
        <div class="campo">
          <label>Quem entrou em contato</label>
          <select data-cap-id="${esc(c.id)}" data-cap-field="contatoFeito" onchange="onChangeCaptacaoField(this)">
            ${selectContatoHTML}
          </select>
        </div>
        <div class="campo">
          <label>Atendido por (corretor)</label>
          <select data-cap-id="${esc(c.id)}" data-cap-field="atendidoPor" onchange="onChangeCaptacaoField(this)">
            <option value="">— Não atribuído —</option>
            ${state.corretores.map(cr => 
              `<option value="${esc(cr.nome)}" ${atendidoPor === cr.nome ? 'selected' : ''}>${esc(cr.nome)}</option>`
            ).join('')}
          </select>
        </div>
      </div>

      <div class="captacao-obs-wrap">
        <label>Observações</label>
        <textarea data-cap-id="${esc(c.id)}" data-cap-field="observacoes" placeholder="Digite aqui observações sobre esse contato..." onchange="onChangeCaptacaoField(this)">${esc(c.observacoes || '')}</textarea>
      </div>

      <div class="barra-acoes" style="justify-content:flex-end;">
        <a class="acao-btn btn-zap" href="https://wa.me/${telZap}" target="_blank" rel="noopener" title="Abrir WhatsApp">
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span class="lbl-btn">WhatsApp</span>
        </a>
        <button class="acao-btn ${isConcluida ? 'btn-tratar' : 'btn-chave'}"
                onclick="toggleConcluidaCaptacao('${esc(c.id)}', ${isConcluida})"
                title="${isConcluida ? 'Desmarcar (volta para pendente)' : 'Marcar como concluída'}">
          <svg class="ico" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span class="lbl-btn">${isConcluida ? 'Desmarcar' : 'Concluir'}</span>
        </button>
      </div>
    </div>
  `;
}

async function onChangeCaptacaoField(el){
  const id = el.dataset.capId;
  const field = el.dataset.capField;
  const valor = el.value;
  if(!id || !field) return;

  // Atualiza localmente
  const item = CAPTACOES_STATE.lista.find(x => String(x.id) === String(id));
  if(item) item[field] = valor;

  // Monta payload
  const payload = { senha: state.adminSenha, id: id };
  payload[field] = valor;

  marcarSalvando(true);
  const res = await api('atualizarCaptacao', payload);
  marcarSalvando(false);

  if(!res.ok){
    toast(res.error || 'Erro ao salvar', 'error');
    return;
  }
  toast('Salvo ✅', 'success');

  // Re-renderiza (caso o filtro de contato esteja ativo)
  renderizarCaptacoes();
  renderizarFiltroCaptacoesCorretores();
}

async function toggleConcluidaCaptacao(id, isConcluida){
  const acao = isConcluida ? 'desmarcar (voltar para pendente)' : 'marcar como concluída';
  const ok = await confirmarAcao({
    titulo: `Confirmar ${acao}?`,
    texto: isConcluida
      ? 'A captação voltará a aparecer na lista de pendentes.'
      : 'A captação sairá da lista de pendentes e o balão será atualizado.',
    btnSim: isConcluida ? 'Desmarcar' : 'Marcar concluída',
    tipo: isConcluida ? 'warn' : 'success'
  });
  if(!ok) return;
  marcarSalvando(true);
  const res = await api('marcarCaptacaoConcluida', {
    senha: state.adminSenha, id: id, concluida: !isConcluida
  });
  marcarSalvando(false);
  if(!res.ok){ toast(res.error || 'Erro ao marcar', 'error'); return; }
  toast(isConcluida ? 'Captação reaberta' : 'Captação concluída ✅', 'success');
  const item = CAPTACOES_STATE.lista.find(x => String(x.id) === String(id));
  if(item) item.concluida = isConcluida ? '' : 'Sim';
  renderizarCaptacoes();
  atualizarBadgeCaptar();
}

/* =====================================================
   INIT
===================================================== */
(async function init(){
  const senhaSalva = localStorage.getItem(ADMIN_KEY);
  if(senhaSalva){
    $('inputAdminSenha').value = senhaSalva;
    state.isAdmin = true;
    state.adminSenha = senhaSalva;
    mostrarView('homeView');
    $('btnSair').classList.remove('hidden');
    try {
      marcarSalvando(true);
      const res = await api('adminListar', { senha: senhaSalva }, TIMEOUT_LOGIN, 1);
      marcarSalvando(false);
      if(!res.ok){
        localStorage.removeItem(ADMIN_KEY);
        state.isAdmin = false;
        state.adminSenha = null;
        $('btnSair').classList.add('hidden');
        mostrarView('adminLoginView');
        setTimeout(() => $('inputAdminSenha').focus(), 200);
        return;
      }
      await carregarHomeAdmin();
    } catch(e){
      console.error(e);
      marcarSalvando(false);
      mostrarView('adminLoginView');
      setTimeout(() => $('inputAdminSenha').focus(), 200);
    }
    return;
  }
  mostrarView('adminLoginView');
  setTimeout(() => $('inputAdminSenha').focus(), 200);
})();

window.addEventListener('beforeunload', function(e){
  if(estaSalvando()){
    e.preventDefault();
    e.returnValue = 'Aguarde, estamos salvando...';
    return e.returnValue;
  }
});
