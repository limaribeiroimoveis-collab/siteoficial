<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leads VIP · Lima Ribeiro Imóveis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f2942'/><text x='50' y='68' font-family='sans-serif' font-size='48' font-weight='800' fill='white' text-anchor='middle'>LR</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --primary:#1e3a5f; --primary-hover:#0f2942; --primary-soft:#eef2f7;
    --success:#2f6b4f; --success-soft:#e6efe9;
    --danger:#8b3a3a; --danger-soft:#f4e6e6;
    --warn:#8b6f3a; --warn-soft:#f5efe0;
    --cad:#0891b2; --cad-soft:#cffafe;
    --vit:#16a34a; --vit-soft:#dcfce7;
    --nao:#64748b; --nao-soft:#f1f5f9;
    --vip:#7c3aed; --vip-hover:#5b21b6; --vip-soft:#ede9fe;
    --bg:#f4f6f8; --bg-alt:#e8ecf0;
    --card:#ffffff;
    --text:#0f172a; --text-soft:#475569; --muted:#94a3b8;
    --border:#e2e8f0; --border-strong:#cbd5e1;
    --radius:8px; --radius-sm:6px; --radius-lg:12px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
    --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 1px 3px rgba(15,23,42,.05);
    --shadow-lg: 0 12px 32px rgba(15,23,42,.12), 0 2px 6px rgba(15,23,42,.06);
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body{
    font-family: var(--font);
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5; font-size: 14px;
  }

  .ico{
    display: inline-block; width: 16px; height: 16px;
    vertical-align: -3px; flex-shrink: 0;
    stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .ico-sm{ width: 14px; height: 14px; }

  /* HEADER */
  .lead-header{
    background: #0f2942; color: #fff;
    padding: 0 16px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    height: 46px;
    display: flex; align-items: center;
  }
  .lead-header-inner{
    width: 100%; max-width: 1600px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; height: 100%;
  }
  .lead-title{
    display: flex; align-items: center; gap: 8px;
    font-size: 0.88rem; font-weight: 700;
    letter-spacing: -.01em; color: #fff;
    min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 1;
  }
  .lead-title .ico{ color: #a78bfa; width: 18px; height: 18px; flex-shrink: 0; }
  .lead-resumo{
    font-size: 0.64rem; color: #cbd5e1; font-weight: 600;
    background: rgba(255,255,255,.08);
    padding: 2px 9px; border-radius: 999px;
    white-space: nowrap; margin-left: 4px; flex-shrink: 0;
  }
  .lead-header-actions{ display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .btn-header-icon{
    background: transparent;
    border: 1px solid rgba(255,255,255,.15);
    color: #cbd5e1; width: 30px; height: 30px;
    border-radius: 6px; display: inline-flex;
    align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s; padding: 0;
  }
  .btn-header-icon:hover{
    background: rgba(255,255,255,.1); color: #fff;
    border-color: rgba(255,255,255,.3);
  }

  /* FILTROS */
  .lead-filtros{
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 8px 16px; position: sticky; top: 46px; z-index: 40;
  }
  .lead-filtros-inner{
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    flex-wrap: nowrap; overflow-x: auto;
    scrollbar-width: thin; -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .lead-filtros-grupo{
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .lead-lbl{
    font-size: .62rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; white-space: nowrap;
  }
  .chip{
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--border-strong);
    font-size: .72rem; font-weight: 600; cursor: pointer;
    transition: all .15s; font-family: inherit; color: var(--text-soft);
    white-space: nowrap;
  }
  .chip:hover{ border-color: var(--primary); color: var(--primary); }
  .chip.active{ background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip.chip-pendente.active{ background: var(--warn); border-color: var(--warn); }
  .chip.chip-cadastrado.active{ background: var(--cad); border-color: var(--cad); }
  .chip.chip-vitrine.active{ background: var(--vit); border-color: var(--vit); }
  .chip.chip-nao-atendemos.active{ background: var(--nao); border-color: var(--nao); }
  .chip .cnt{
    background: rgba(15,23,42,.08); padding: 0px 6px;
    border-radius: 999px; font-size: .6rem; font-weight: 700;
    min-width: 16px; text-align: center;
  }
  .chip.active .cnt{ background: rgba(255,255,255,.25); }
  .chip .dot{
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; flex-shrink: 0;
  }
  .chip .dot-warn{ background: var(--warn); }
  .chip .dot-cad{ background: var(--cad); }
  .chip .dot-vit{ background: var(--vit); }
  .chip .dot-nao{ background: var(--nao); }
  .chip.active .dot{ background: #fff !important; opacity: .9; }

  /* LISTA */
  .lead-lista-wrap{
    max-width: 1600px; margin: 0 auto;
    padding: 18px 22px 40px;
  }
  .lead-lista{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 14px; align-content: start;
  }
  @media(max-width:820px){
    .lead-lista{ grid-template-columns: 1fr; gap: 10px; }
    .lead-lista-wrap{ padding: 12px 12px 30px; }
  }

  /* CARD */
  .lead-card{
    background: #fff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--warn);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: all .18s; position: relative;
  }
  .lead-card:hover{
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .lead-card.status-pendente{ border-left-color: var(--warn); background: #fff; }
  .lead-card.status-cadastrado{ border-left-color: var(--cad); background: linear-gradient(180deg, #f0fdff 0%, #e0f7fa 100%); }
  .lead-card.status-vitrine{ border-left-color: var(--vit); background: linear-gradient(180deg, #f5faf7 0%, #e6efe9 100%); opacity: .92; }
  .lead-card.status-nao-atendemos{ border-left-color: var(--nao); background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%); opacity: .75; }

  .lc-l1{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lc-nome{
    font-size: .92rem; font-weight: 700; color: var(--text);
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -.005em;
  }
  .lc-tel{
    font-size: .72rem; color: var(--text-soft);
    font-family: var(--mono); white-space: nowrap;
  }
  .lc-status-tag{
    font-size: .58rem; font-weight: 800;
    padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .3px;
    white-space: nowrap;
  }
  .lc-status-tag.pendente{ background: var(--warn-soft); color: var(--warn); }
  .lc-status-tag.cadastrado{ background: var(--cad-soft); color: var(--cad); }
  .lc-status-tag.vitrine{ background: var(--vit-soft); color: var(--vit); }
  .lc-status-tag.nao-atendemos{ background: var(--nao-soft); color: var(--nao); }

  .lc-l2{
    font-size: .72rem; color: var(--text-soft);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .lc-l2 .ico{ flex-shrink: 0; color: var(--muted); width: 14px; height: 14px; }
  .lc-l2 .idade{
    font-size: .64rem; color: var(--muted);
    font-family: var(--mono); font-weight: 600;
    margin-left: auto; white-space: nowrap;
  }
  .lc-l2 .idade.recente{ color: var(--success); }
  .lc-l2 .idade.antigo{ color: var(--danger); }

  /* PERFIL (tags de preferências) */
  .lc-perfil{
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 10px;
    background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
    border: 1px solid #e9d5ff;
    border-radius: var(--radius-sm);
  }
  .lc-perfil .tagv{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: .68rem; font-weight: 700;
    padding: 3px 9px; border-radius: 4px;
    background: #fff; color: #5b21b6;
    border: 1px solid #ddd6fe;
    white-space: nowrap;
  }
  .lc-perfil .tagv .lbl{ font-weight: 500; color: #7c3aed; opacity: .8; }
  .lc-perfil .tagv.destaque{
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    border-color: #fbbf24; color: #78350f;
  }
  .lc-perfil .tagv.bairro{
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    border-color: #c4b5fd; color: #5b21b6;
  }
  .lc-perfil .tagv.tanto-faz{
    background: #f1f5f9; color: var(--muted);
    border-color: var(--border);
    font-style: italic; font-weight: 500;
  }
  .lc-perfil .tagv.bairro-digitado{
    background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
    border-color: #93c5fd; color: #1e40af;
  }
  .lc-perfil .tagv.cidade{
    background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    border-color: #6ee7b7; color: #065f46;
  }

  .lc-detalhes{
    font-size: .74rem; color: var(--text-soft);
    padding: 8px 10px; background: var(--bg);
    border-left: 3px solid var(--muted);
    border-radius: 4px; line-height: 1.5;
    word-break: break-word;
  }
  .lc-detalhes strong{ color: var(--text); font-weight: 700; }

  /* SELECTS */
  .lc-selects{
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .lc-campo{ display: flex; flex-direction: column; gap: 3px; }
  .lc-campo label{
    font-size: .58rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .3px; margin: 0;
  }
  .lc-campo select{
    padding: 6px 9px; font-size: .74rem; border-radius: 6px;
    border: 1px solid var(--border-strong); background: #fff;
    height: auto; min-height: 30px; font-family: inherit;
    color: var(--text); cursor: pointer;
  }
  .lc-campo select:focus{
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30,58,95,.1);
  }
  .lc-campo select.corretor-obrigatorio{
    border-color: var(--warn); background: #fdfaf3;
    animation: pulse-warn 1.5s ease-in-out infinite;
  }
  @keyframes pulse-warn{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(139,111,58,.3); }
    50%{ box-shadow: 0 0 0 4px rgba(139,111,58,.1); }
  }

  /* OBSERVAÇÕES */
  .lc-obs-wrap{
    display: none; flex-direction: column; gap: 4px;
    padding-top: 8px; border-top: 1px dashed var(--border);
  }
  .lead-card.obs-aberta .lc-obs-wrap{ display: flex; }
  .lc-obs-wrap label{
    font-size: .6rem; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .3px; margin: 0;
  }
  .lc-obs-wrap textarea{
    min-height: 70px; font-size: .78rem;
    padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border-strong);
    resize: vertical; font-family: inherit; line-height: 1.5;
  }
  .lc-obs-wrap textarea:focus{
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30,58,95,.1);
  }

  /* AÇÕES */
  .lc-l3{
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding-top: 8px; border-top: 1px dashed var(--border);
  }
  .lc-data{
    font-size: .64rem; color: var(--muted);
    font-family: var(--mono); margin-right: auto;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .corretor-badge{
    display: inline-flex; align-items: center;
    font-size: .62rem; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    color: #fff; letter-spacing: .2px;
  }
  .lc-acoes{ display: flex; gap: 4px; align-items: center; }
  .lc-btn{
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 7px;
    border: 1px solid var(--border); background: #fff;
    color: var(--text-soft); cursor: pointer;
    transition: all .15s; text-decoration: none; padding: 0;
  }
  .lc-btn:hover{
    background: var(--bg); border-color: var(--border-strong);
    color: var(--text); transform: translateY(-1px);
  }
  .lc-btn .ico{ width: 15px; height: 15px; }
  .lc-btn.btn-zap{ color: #25d366; }
  .lc-btn.btn-zap:hover{ background: #e7f6ed; border-color: #25d366; color: #128c7e; }
  .lc-btn.btn-edit:hover{ background: var(--primary-soft); border-color: #c9d6e4; color: var(--primary); }
  .lc-btn.btn-msg{
    background: var(--vip); border-color: var(--vip); color: #fff;
  }
  .lc-btn.btn-msg:hover{
    background: var(--vip-hover); border-color: var(--vip-hover);
    transform: translateY(-1px);
  }
  .lc-btn.btn-msg.desabilitado{
    background: #e2e8f0; border-color: #cbd5e1;
    color: #94a3b8 !important; cursor: not-allowed;
  }
  .lc-btn.btn-expandir.ativo{
    background: var(--primary-soft); border-color: var(--primary);
    color: var(--primary);
  }
  .lc-btn.btn-expandir.tem-conteudo{
    background: #dbeafe; border-color: #3b82f6; color: #1d4ed8;
  }
  .lc-btn.btn-expandir{ position: relative; }
  .lc-btn.btn-expandir .dot-obs{
    position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #1d4ed8; border: 1.5px solid #fff;
  }

  /* MODAIS */
  .backdrop{
    position: fixed; inset: 0; background: rgba(15,23,42,.6);
    z-index: 1000; display: none;
    align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(3px);
  }
  .backdrop.show{ display: flex; }
  .modal{
    background: #fff; border-radius: var(--radius-lg);
    max-width: 620px; width: 100%;
    max-height: 92vh; overflow: auto; padding: 24px;
    position: relative; box-shadow: var(--shadow-lg);
  }
  .modal-close{
    position: absolute; top: 14px; right: 14px;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-soft); line-height: 1;
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    transition: background .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover{ background: var(--bg-alt); color: var(--text); }
  .modal h2{
    font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em;
    margin-bottom: 18px; display: flex; align-items: center; gap: 9px;
  }

  /* Detalhes */
  .det-secao{ margin-bottom: 16px; }
  .det-secao:last-child{ margin-bottom: 0; }
  .det-secao-titulo{
    font-size: .68rem; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .det-secao-titulo .ico{ color: var(--vip); }
  .det-grid{
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .det-item{
    background: var(--bg); padding: 10px 12px;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--border-strong);
  }
  .det-item.destaque{
    background: var(--vip-soft); border-left-color: var(--vip);
  }
  .det-item .lbl{
    font-size: .6rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px;
  }
  .det-item .val{
    font-size: .88rem; font-weight: 700; color: var(--text);
    word-break: break-word;
  }
  .det-item .val.muted{
    font-style: italic; color: var(--muted); font-weight: 500;
  }
  .det-bairros{ display: flex; flex-wrap: wrap; gap: 5px; }
  .det-bairro{
    display: inline-flex; align-items: center;
    padding: 5px 11px;
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    border: 1px solid #c4b5fd; border-radius: 999px;
    font-size: .74rem; font-weight: 700; color: #5b21b6;
  }
  .det-bairro.cidade{
    background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    border-color: #6ee7b7; color: #065f46;
  }
  .det-bairro.digitado{
    background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
    border-color: #93c5fd; color: #1e40af;
  }
  .det-detalhes-box{
    background: #fef9c3; border: 1px solid #fde68a;
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: .84rem; line-height: 1.6; color: #78350f;
    white-space: pre-wrap; word-break: break-word;
  }
  .det-detalhes-box.vazio{
    background: var(--bg); border-color: var(--border);
    color: var(--muted); font-style: italic;
  }
  .det-rodape{
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 18px; flex-wrap: wrap;
  }

  /* Edit */
  .edit-campo{
    display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px;
  }
  .edit-campo label{
    font-size: .68rem; font-weight: 700; color: var(--text-soft);
    text-transform: uppercase; letter-spacing: .3px;
  }
  .edit-campo input, .edit-campo textarea{
    padding: 9px 11px; border: 1px solid var(--border-strong);
    border-radius: 6px; font-size: .86rem;
    font-family: inherit; color: var(--text);
    background: #fff; transition: all .15s;
  }
  .edit-campo input:focus, .edit-campo textarea:focus{
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30,58,95,.1);
  }
  .edit-campo textarea{ min-height: 70px; resize: vertical; line-height: 1.5; }
  .edit-grid-2{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Botões */
  .btn{
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 16px; border-radius: var(--radius-sm);
    border: 1px solid transparent; cursor: pointer;
    font-size: .84rem; font-weight: 600;
    transition: all .15s; text-decoration: none;
    font-family: inherit; white-space: nowrap;
  }
  .btn:disabled{ opacity: .5; cursor: not-allowed; }
  .btn-primary{ background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled){ background: var(--primary-hover); }
  .btn-ghost{ background: #fff; color: var(--text-soft); border: 1px solid var(--border-strong); }
  .btn-ghost:hover:not(:disabled){ background: var(--bg-alt); color: var(--text); }
  .btn-vip{ background: var(--vip); color: #fff; }
  .btn-vip:hover:not(:disabled){ background: var(--vip-hover); }

  /* Toast */
  .toast{
    position: fixed; bottom: 24px; left: 50%;
    transform: translate(-50%, 30px);
    background: #0f172a; color: #fff;
    padding: 12px 22px; border-radius: var(--radius);
    box-shadow: var(--shadow-lg); opacity: 0;
    transition: all .3s; z-index: 2001;
    font-size: .85rem; font-weight: 600;
    max-width: 90vw; pointer-events: none; text-align: center;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }
  .toast.success{ background: var(--success); }
  .toast.error{ background: var(--danger); }
  .toast.warn{ background: var(--warn); }

  /* Loader */
  .loader{
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .6s linear infinite;
  }
  .loader-lg{ width: 34px; height: 34px; border-width: 3px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .loading-inline{
    text-align: center; padding: 50px 20px; color: var(--vip);
    grid-column: 1 / -1;
  }
  .loading-inline p{ margin-top: 10px; font-size: .85rem; color: var(--text-soft); }
  .empty-state{
    text-align: center; padding: 60px 20px; color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty-state h3{ font-size: 1rem; margin-bottom: 6px; color: var(--text-soft); font-weight: 700; }
  .empty-state p{ font-size: .85rem; }

  .saving-overlay{
    position: fixed; inset: 0; background: rgba(15,23,42,.7);
    z-index: 9999; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #fff;
    text-align: center; padding: 20px; backdrop-filter: blur(3px);
  }
  .saving-overlay.show{ display: flex; }
  .saving-overlay .spinner{
    width: 46px; height: 46px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .saving-overlay .msg{ font-size: 1rem; font-weight: 600; }
</style>
</head>

<script>
/* =====================================================
   CONFIG
===================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzuCjg_5ZJDMWWKmjYp1ThW34iWS0YouviWFdiMGx8W3yApv0F1fdUcjeZdjm0s6Mg/exec';
const ADMIN_KEY = 'vitrine_admin_v11';
const CORRETORES_CACHE_KEY = 'vitrine_corretores_v11';
const TIMEOUT_API = 90000;

const CORRETORES_INFO = {
  'Hugo':     { nomeCompleto: 'Hugo Ribeiro',  funcao: 'Corretor',  genero: 'M' },
  'Carolina': { nomeCompleto: 'Carolina Lima', funcao: 'Corretora', genero: 'F' }
};

const STATUS_LABEL = {
  '': 'Pendente', 'cadastrado': 'Cliente cadastrado',
  'vitrine': 'Vitrine enviada', 'nao-atendemos': 'Área não atendida'
};
const STATUS_CLASSE = {
  '': 'pendente', 'cadastrado': 'cadastrado',
  'vitrine': 'vitrine', 'nao-atendemos': 'nao-atendemos'
};
const STATUS_ICONE = {
  '': '⏳', 'cadastrado': '📝', 'vitrine': '✅', 'nao-atendemos': '🚫'
};

const $ = id => document.getElementById(id);

const state = {
  adminSenha: null,
  corretores: [],
  lista: [],
  filtroStatus: 'pendente',
  filtrosCorretores: new Set(),
  obsAbertas: new Set(),
  salvando: 0,
  _msgLeadAtual: null,
  _msgAtuais: null,
  _detLeadAtual: null
};

/* UTILS */
function esc(s){
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function normalizaTel(t){ return String(t || '').replace(/\D/g, ''); }
function fmtTel(t){
  const n = normalizaTel(t);
  if(n.length === 11) return `(${n.slice(0,2)}) ${n.slice(2,3)} ${n.slice(3,7)}-${n.slice(7)}`;
  if(n.length === 10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
  return String(t || '');
}
function fmtDataHora(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '—';
  const dia = String(dt.getDate()).padStart(2,'0');
  const mes = String(dt.getMonth()+1).padStart(2,'0');
  const ano = dt.getFullYear();
  const h = String(dt.getHours()).padStart(2,'0');
  const m = String(dt.getMinutes()).padStart(2,'0');
  return `${dia}/${mes}/${ano} às ${h}:${m}`;
}
function idadeLead(d){
  if(!d) return { txt: '', classe: '' };
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return { txt: '', classe: '' };
  const diff = Date.now() - dt.getTime();
  const dias = Math.floor(diff / 86400000);
  const horas = Math.floor(diff / 3600000);
  if(horas < 1) return { txt: 'agora há pouco', classe: 'recente' };
  if(horas < 24) return { txt: `há ${horas}h`, classe: 'recente' };
  if(dias === 1) return { txt: 'há 1 dia', classe: 'recente' };
  if(dias < 7) return { txt: `há ${dias} dias`, classe: '' };
  return { txt: `há ${dias} dias`, classe: 'antigo' };
}
function mascaraTelefone(input){
  let v = input.value.replace(/\D/g, '');
  if(v.length > 11) v = v.slice(0, 11);
  let out = '';
  if(v.length === 0) out = '';
  else if(v.length <= 2) out = '(' + v;
  else if(v.length <= 3) out = '(' + v.slice(0,2) + ') ' + v.slice(2);
  else if(v.length <= 7) out = '(' + v.slice(0,2) + ') ' + v.slice(2,3) + ' ' + v.slice(3);
  else out = '(' + v.slice(0,2) + ') ' + v.slice(2,3) + ' ' + v.slice(3,7) + '-' + v.slice(7);
  input.value = out;
}
function corDoCorretor(nome){
  if(!nome) return '#64748b';
  const c = state.corretores.find(x => x.nome === nome);
  if(c && c.cor) return c.cor;
  return '#64748b';
}
function doisPrimeirosNomes_(nomeCompleto){
  const preposicoes = new Set(['de','da','do','das','dos','e']);
  const partes = String(nomeCompleto || '').trim().split(/\s+/);
  const significativas = partes.filter(p => p && !preposicoes.has(p.toLowerCase()));
  return significativas.slice(0, 2).join(' ');
}
function fmtValorBR_(v){
  const n = parseInt(String(v).replace(/\D/g,''), 10);
  if(isNaN(n) || n <= 0) return '—';
  if(n >= 1000000){
    const mi = n / 1000000;
    return 'R$ ' + (mi % 1 === 0 ? mi : mi.toFixed(1)).toString().replace('.', ',') + ' mi';
  }
  return 'R$ ' + Math.round(n / 1000) + ' mil';
}
function toast(msg, type=''){
  const t = $('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3200);
}
function marcarSalvando(inicio){
  if(inicio) state.salvando++;
  else state.salvando = Math.max(0, state.salvando - 1);
  const ov = $('savingOverlay');
  if(ov) ov.classList.toggle('show', state.salvando > 0);
}

/* API */
async function apiOnce(action, params, timeoutMs){
  const qs = new URLSearchParams({ action, ...params, _t: Date.now() }).toString();
  const url = API_URL + '?' + qs;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(url, {
      method: 'GET', mode: 'cors',
      headers: { 'Accept': 'application/json' },
      redirect: 'follow', signal: controller.signal
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}
async function api(action, params = {}, timeoutMs = TIMEOUT_API, retries = 2) {
  let lastErr;
  for (let i = 0; i <= retries; i++) {
    try { return await apiOnce(action, params, timeoutMs); }
    catch (err) {
      lastErr = err;
      if (i < retries) await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
  console.error('API falhou:', lastErr, { action, params });
  return { ok: false, error: 'Falha ao conectar: ' + lastErr.message };
}

/* CORRETORES */
async function carregarCorretores(){
  try {
    const cache = JSON.parse(localStorage.getItem(CORRETORES_CACHE_KEY) || 'null');
    if(cache && Array.isArray(cache.data) && cache.data.length > 0){
      state.corretores = cache.data;
    }
  } catch(e){}
  const res = await api('listarCorretores', { senha: state.adminSenha });
  if(res.ok && Array.isArray(res.data) && res.data.length > 0){
    state.corretores = res.data;
    try { localStorage.setItem(CORRETORES_CACHE_KEY, JSON.stringify({ data: res.data, ts: Date.now() })); } catch(e){}
  }
  if(!state.corretores || state.corretores.length === 0){
    state.corretores = [
      { nome: 'Hugo',     cor: '#1e40af' },
      { nome: 'Carolina', cor: '#9333ea' }
    ];
  }
}

/* STATUS */
function normalizaStatus_(s){
  const v = String(s || '').trim().toLowerCase();
  if(v === '') return '';
  if(v === 'cadastrado') return 'cadastrado';
  if(v === 'vitrine' || v === 'vitrine-enviada' || v === 'concluida') return 'vitrine';
  if(v === 'nao-atendemos' || v === 'nao_atendemos' || v === 'nao') return 'nao-atendemos';
  return '';
}
function statusLead_(lead){ return normalizaStatus_(lead.status); }

/* CARREGAR */
async function carregarLeads(mostrarLoading){
  if(mostrarLoading){
    $('leadLista').innerHTML = '<div class="loading-inline"><span class="loader loader-lg"></span><p>Carregando leads...</p></div>';
  }
  marcarSalvando(true);
  const res = await api('listarLeadsVIP', { senha: state.adminSenha });
  marcarSalvando(false);
  if(!res.ok){
    $('leadLista').innerHTML = '<div class="empty-state"><h3>Erro ao carregar leads</h3><p>' + esc(res.error || '') + '</p></div>';
    return;
  }
  state.lista = res.data || [];
  atualizarContadores();
  renderizarFiltroCorretores();
  renderizarLeads();
}

function atualizarContadores(){
  const lista = state.lista || [];
  const total = lista.length;
  const pendente = lista.filter(l => statusLead_(l) === '').length;
  const cadastrado = lista.filter(l => statusLead_(l) === 'cadastrado').length;
  const vitrine = lista.filter(l => statusLead_(l) === 'vitrine').length;
  const naoAtendemos = lista.filter(l => statusLead_(l) === 'nao-atendemos').length;

  if($('cntTodos')) $('cntTodos').textContent = total;
  if($('cntPendente')) $('cntPendente').textContent = pendente;
  if($('cntCadastrado')) $('cntCadastrado').textContent = cadastrado;
  if($('cntVitrine')) $('cntVitrine').textContent = vitrine;
  if($('cntNaoAtendemos')) $('cntNaoAtendemos').textContent = naoAtendemos;

  const resumo = $('leadResumo');
  if(resumo){
    resumo.textContent = `${total} lead${total===1?'':'s'} · ${pendente} pendente${pendente===1?'':'s'} · ${cadastrado} em cadastro · ${vitrine} concluído${vitrine===1?'':'s'}`;
  }
}

/* FILTROS */
function setStatusLeads(status, btn){
  state.filtroStatus = status;
  document.querySelectorAll('.lead-filtros-grupo .chip[data-lead-status]').forEach(b => {
    b.classList.toggle('active', b.dataset.leadStatus === status);
  });
  renderizarFiltroCorretores();
  renderizarLeads();
}
function renderizarFiltroCorretores(){
  const wrap = $('leadFiltroCorretores');
  if(!wrap) return;
  let base = state.lista || [];
  if(state.filtroStatus !== 'todos'){
    const filtroNorm = state.filtroStatus === 'pendente' ? '' : state.filtroStatus;
    base = base.filter(l => statusLead_(l) === filtroNorm);
  }
  const corretoresDoStatus = new Set();
  base.forEach(l => {
    const ap = String(l.atendidoPor || '').trim();
    if(ap) corretoresDoStatus.add(ap);
  });
  const paraRemover = [];
  state.filtrosCorretores.forEach(nome => {
    if(!corretoresDoStatus.has(nome)) paraRemover.push(nome);
  });
  paraRemover.forEach(nome => state.filtrosCorretores.delete(nome));

  if(corretoresDoStatus.size === 0){
    wrap.innerHTML = `<span class="lead-lbl">Corretor:</span><span style="font-size:.72rem; color:var(--muted); font-style:italic;">Nenhum atribuído</span>`;
    return;
  }
  const chips = [...corretoresDoStatus].sort((a,b) => a.localeCompare(b,'pt-BR')).map(nome => {
    const cnt = base.filter(x => String(x.atendidoPor || '').trim() === nome).length;
    const ativo = state.filtrosCorretores.has(nome);
    const cor = corDoCorretor(nome);
    return `<button class="chip chip-corretor ${ativo ? 'active' : ''}"
              style="background:${ativo ? cor : '#fff'}; color:${ativo ? '#fff' : cor}; border-color:${cor}"
              onclick="toggleFiltroCorretor('${esc(nome)}')">
              ${esc(nome)} <span class="cnt">${cnt}</span>
            </button>`;
  }).join('');
  wrap.innerHTML = `
    <span class="lead-lbl">Corretor:</span>
    <button class="chip ${state.filtrosCorretores.size === 0 ? 'active' : ''}" onclick="limparFiltroCorretor()">Todos</button>
    ${chips}
  `;
}
function toggleFiltroCorretor(nome){
  if(state.filtrosCorretores.has(nome)) state.filtrosCorretores.delete(nome);
  else state.filtrosCorretores.add(nome);
  renderizarFiltroCorretores();
  renderizarLeads();
}
function limparFiltroCorretor(){
  state.filtrosCorretores.clear();
  renderizarFiltroCorretores();
  renderizarLeads();
}

/* RENDER LEADS */
function renderizarLeads(){
  const container = $('leadLista');
  if(!container) return;
  let arr = [...(state.lista || [])];
  if(state.filtroStatus !== 'todos'){
    const filtroNorm = state.filtroStatus === 'pendente' ? '' : state.filtroStatus;
    arr = arr.filter(l => statusLead_(l) === filtroNorm);
  }
  if(state.filtrosCorretores.size > 0){
    arr = arr.filter(l => state.filtrosCorretores.has(String(l.atendidoPor || '').trim()));
  }
  arr.sort((a, b) => new Date(b.dataHora||0) - new Date(a.dataHora||0));
  if(arr.length === 0){
    let msg = 'Nenhum lead nesse filtro';
    let sub = 'Tente outro filtro.';
    if(state.filtroStatus === 'pendente'){ msg = 'Nenhum lead pendente 🎉'; sub = 'Você está em dia!'; }
    else if(state.filtroStatus === 'todos'){ msg = 'Nenhum lead cadastrado ainda'; sub = 'Aguardando novos leads.'; }
    container.innerHTML = `<div class="empty-state"><h3>${msg}</h3><p>${sub}</p></div>`;
    return;
  }
  container.innerHTML = arr.map(c => leadCardHTML(c)).join('');
}

/* =====================================================
   ✅ CARD DO LEAD
===================================================== */
function leadCardHTML(l){
  const status = statusLead_(l);
  const statusClasse = STATUS_CLASSE[status];
  const statusLabel = STATUS_LABEL[status];
  const statusIcone = STATUS_ICONE[status];

  const tel = normalizaTel(l.telefone);
  const telFmt = fmtTel(tel);
  const telZap = tel.startsWith('55') ? tel : '55' + tel;
  const atendidoPor = String(l.atendidoPor || '').trim();
  const temCorretor = !!atendidoPor;
  const obsAberta = state.obsAbertas.has(String(l.id));
  const obsTemConteudo = String(l.observacoes || '').trim().length > 0;

  const idade = idadeLead(l.dataHora);
  const nome = String(l.nome || '(sem nome)').trim();
  const statusTag = `<span class="lc-status-tag ${statusClasse}">${statusIcone} ${esc(statusLabel)}</span>`;

  const perfilHTML = montarPerfilHTML(l);

  const detalhes = String(l.detalhes || '').trim();
  const detalhesHTML = detalhes && detalhes !== 'nenhum'
    ? `<div class="lc-detalhes"><strong>📝 Detalhes:</strong> ${esc(detalhes)}</div>`
    : '';

  const statusOpts = `
    <option value="" ${status === '' ? 'selected' : ''}>⏳ Pendente</option>
    <option value="cadastrado" ${status === 'cadastrado' ? 'selected' : ''}>📝 Cliente cadastrado</option>
    <option value="vitrine" ${status === 'vitrine' ? 'selected' : ''}>✅ Vitrine enviada</option>

/* =====================================================
   ✅ PERFIL — tags das preferências
   CIDADES (campo bairros) + BAIRROS DIGITADOS (campo novo)
===================================================== */
function montarPerfilHTML(l){
  const tags = [];

  // CIDADE (do campo l.bairros, que na prática guarda as cidades)
  const cidades = String(l.bairros || '').trim();
  if(cidades && cidades !== 'tanto-faz'){
    const lista = cidades.split(',').map(s => s.trim()).filter(Boolean).slice(0, 4);
    lista.forEach(c => {
      tags.push(`<span class="tagv cidade">🏙️ ${esc(c)}</span>`);
    });
    const totalCid = cidades.split(',').filter(Boolean).length;
    if(totalCid > 4){
      tags.push(`<span class="tagv cidade">+${totalCid - 4}</span>`);
    }
  }

  // BAIRROS DIGITADOS (campo novo l.bairrosDigitados)
  const bairrosDigitados = String(l.bairrosDigitados || '').trim();
  if(bairrosDigitados){
    const listaB = bairrosDigitados.split(',').map(s => s.trim()).filter(Boolean).slice(0, 5);
    listaB.forEach(b => {
      tags.push(`<span class="tagv bairro-digitado">📍 ${esc(b)}</span>`);
    });
    const totalB = bairrosDigitados.split(',').filter(Boolean).length;
    if(totalB > 5){
      tags.push(`<span class="tagv bairro-digitado">+${totalB - 5}</span>`);
    }
  }

  // TIPO E TIPO APTO
  let tipoFinal = l.tipo || '';
  const detalhesStr = String(l.detalhes || '');
  const matchTipoApto = detalhesStr.match(/Tipo Apto:\s*([^|]+)/i);
  if(matchTipoApto && matchTipoApto[1].trim()){
    tipoFinal += ' (' + matchTipoApto[1].trim() + ')';
  }
  if(tipoFinal){
    tags.push(`<span class="tagv destaque"><span class="lbl">Tipo:</span> ${esc(tipoFinal)}</span>`);
  }

  // CÔMODOS
  if(l.quartos && l.quartos !== 'tanto-faz'){
    tags.push(`<span class="tagv"><span class="lbl">🛏</span> ${esc(l.quartos)}+ quartos</span>`);
  } else {
    tags.push(`<span class="tagv tanto-faz">🛏 Quartos: tanto faz</span>`);
  }

  if(l.banheiros && l.banheiros !== 'tanto-faz'){
    tags.push(`<span class="tagv"><span class="lbl">🚿</span> ${esc(l.banheiros)}+ banh.</span>`);
  }
  if(l.suites && l.suites !== 'tanto-faz'){
    tags.push(`<span class="tagv"><span class="lbl">🛁</span> ${esc(l.suites)}+ suítes</span>`);
  }
  if(l.vagas && l.vagas !== 'tanto-faz'){
    tags.push(`<span class="tagv"><span class="lbl">🚗</span> ${esc(l.vagas)}+ vagas</span>`);
  } else {
    tags.push(`<span class="tagv tanto-faz">🚗 Vagas: tanto faz</span>`);
  }

  // METRAGEM
  const metMin = String(l.metragemMin || '').trim();
  const metMax = String(l.metragemMax || '').trim();
  if(metMin && metMax){
    tags.push(`<span class="tagv"><span class="lbl">📐</span> ${esc(metMin)} a ${esc(metMax)} m²</span>`);
  } else if(metMin){
    tags.push(`<span class="tagv"><span class="lbl">📐</span> a partir de ${esc(metMin)} m²</span>`);
  } else if(metMax){
    tags.push(`<span class="tagv"><span class="lbl">📐</span> até ${esc(metMax)} m²</span>`);
  }

  // VALOR
  const valMin = String(l.valorMin || '').trim();
  const valMax = String(l.valorMax || '').trim();
  if(valMin && valMax){
    tags.push(`<span class="tagv destaque"><span class="lbl">💰</span> ${fmtValorBR_(valMin)} a ${fmtValorBR_(valMax)}</span>`);
  } else if(valMax){
    tags.push(`<span class="tagv destaque"><span class="lbl">💰</span> até ${fmtValorBR_(valMax)}</span>`);
  } else if(valMin){
    tags.push(`<span class="tagv destaque"><span class="lbl">💰</span> a partir de ${fmtValorBR_(valMin)}</span>`);
  }

  // PETS
  const matchPet = detalhesStr.match(/Pets:\s*([^|]+)/i);
  if(matchPet && matchPet[1].trim()){
    tags.push(`<span class="tagv"><span class="lbl">🐾</span> ${esc(matchPet[1].trim())}</span>`);
  }

  return `<div class="lc-perfil">${tags.join('')}</div>`;
}

/* TOGGLE OBS */
function toggleObsLead(id){
  if(state.obsAbertas.has(id)) state.obsAbertas.delete(id);
  else state.obsAbertas.add(id);
  const card = document.querySelector(`.lead-card[data-id="${id}"]`);
  if(card){
    card.classList.toggle('obs-aberta');
    const btn = card.querySelector('.btn-expandir');
    if(btn) btn.classList.toggle('ativo');
  }
}

/* ONCHANGE STATUS */
async function onChangeStatus(el){
  const id = el.dataset.leadId;
  const valor = el.value;
  if(!id) return;
  const item = state.lista.find(x => String(x.id) === String(id));
  if(!item) return;

  if((valor === 'cadastrado' || valor === 'vitrine') && !String(item.atendidoPor || '').trim()){
    toast('Escolha o corretor antes de marcar como "' + STATUS_LABEL[valor] + '".', 'warn');
    el.value = statusLead_(item);
    const card = document.querySelector(`.lead-card[data-id="${id}"]`);
    if(card){
      const selCorretor = card.querySelector(`select[data-lead-field="atendidoPor"]`);
      if(selCorretor){
        selCorretor.classList.add('corretor-obrigatorio');
        selCorretor.focus();
        selCorretor.scrollIntoView({ behavior:'smooth', block:'center' });
      }
    }
    return;
  }

  const anterior = item.status || '';
  item.status = valor;

  marcarSalvando(true);
  const res = await api('atualizarLeadVIP', { senha: state.adminSenha, id: id, status: valor });
  marcarSalvando(false);

  if(!res.ok){
    toast(res.error || 'Erro ao salvar', 'error');
    item.status = anterior;
    renderizarLeads();
    return;
  }
  toast('Status atualizado ✅', 'success');
  atualizarContadores();
  renderizarFiltroCorretores();
  renderizarLeads();
}

/* ONCHANGE CORRETOR */
async function onChangeCorretor(el){
  const id = el.dataset.leadId;
  const valor = el.value;
  if(!id) return;
  const item = state.lista.find(x => String(x.id) === String(id));
  if(!item) return;
  const statusAtual = statusLead_(item);
  if(!valor && (statusAtual === 'cadastrado' || statusAtual === 'vitrine')){
    toast('Não é possível remover o corretor com status "' + STATUS_LABEL[statusAtual] + '". Mude o status antes.', 'warn');
    el.value = item.atendidoPor || '';
    return;
  }
  const anterior = item.atendidoPor || '';
  item.atendidoPor = valor;

  marcarSalvando(true);
  const res = await api('atualizarLeadVIP', { senha: state.adminSenha, id: id, atendidoPor: valor });
  marcarSalvando(false);

  if(!res.ok){
    toast(res.error || 'Erro ao salvar', 'error');
    item.atendidoPor = anterior;
    renderizarLeads();
    return;
  }
  toast('Corretor atualizado ✅', 'success');
  renderizarFiltroCorretores();
  renderizarLeads();
}

/* ONCHANGE OBS */
let _obsTimers = {};
async function onChangeObs(el){
  const id = el.dataset.leadId;
  const valor = el.value;
  if(!id) return;
  const item = state.lista.find(x => String(x.id) === String(id));
  if(!item) return;
  if(String(item.observacoes || '') === String(valor || '')) return;
  item.observacoes = valor;
  clearTimeout(_obsTimers[id]);
  _obsTimers[id] = setTimeout(async () => {
    marcarSalvando(true);
    const res = await api('atualizarLeadVIP', { senha: state.adminSenha, id: id, observacoes: valor });
    marcarSalvando(false);
    if(!res.ok){ toast(res.error || 'Erro ao salvar observação', 'error'); return; }
    toast('Observação salva ✅', 'success');
    const card = document.querySelector(`.lead-card[data-id="${id}"]`);
    if(card){
      const btn = card.querySelector('.btn-expandir');
      if(btn){
        const tem = String(valor).trim().length > 0;
        btn.classList.toggle('tem-conteudo', tem);
        const dot = btn.querySelector('.dot-obs');
        if(tem && !dot){
          const span = document.createElement('span');
          span.className = 'dot-obs';
          btn.appendChild(span);
        } else if(!tem && dot){
          dot.remove();
        }
      }
    }
  }, 600);
}

      </div>

        ? `<div class="det-detalhes-box">${esc(detalhesLimpos)}</div>`
        : '<div class="det-detalhes-box vazio">Nenhum detalhe extra informado</div>'
      }
    </div>
  `;

  const btnMsg = $('detBtnMsg');
  if(btnMsg){
    const temCorretor = !!String(item.atendidoPor || '').trim();
    btnMsg.disabled = !temCorretor;
    btnMsg.style.opacity = temCorretor ? '1' : '.5';
    btnMsg.style.cursor = temCorretor ? 'pointer' : 'not-allowed';
    btnMsg.innerHTML = temCorretor
      ? '<svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Ver mensagens prontas'
      : '<svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Atribua um corretor primeiro';
  }

  corpo.innerHTML = html;
  $('detBackdrop').classList.add('show');
}
function fecharDetalhes(){
  $('detBackdrop').classList.remove('show');
  state._detLeadAtual = null;
}
function abrirMsgDoDetalhe(){
  const item = state._detLeadAtual;
  if(!item) return;
  if(!String(item.atendidoPor || '').trim()){
    toast('Atribua um corretor primeiro.', 'warn');
    return;
  }
  fecharDetalhes();
  abrirMsgModal(item.id);
}

/* =====================================================
   EDITAR — preserva os bairros digitados no campo
===================================================== */
function abrirEditModal(id){
  const item = state.lista.find(x => String(x.id) === String(id));
  if(!item){ toast('Lead não encontrado', 'error'); return; }
  $('editLeadId').value = id;
  $('editNome').value = item.nome || '';
  $('editTelefone').value = fmtTel(item.telefone || '');
  // Junta cidades + bairros digitados para o usuário editar num só lugar
  const cidades = String(item.bairros || '').replace(/tanto-faz/gi, '').trim();
  const digitados = String(item.bairrosDigitados || '').trim();
  const partes = [];
  if(cidades) partes.push(cidades);
  if(digitados) partes.push(digitados);
  $('editBairros').value = partes.join(', ');
  $('editDetalhes').value = String(item.detalhes || '').replace(/^nenhum$/i, '');
  $('editBackdrop').classList.add('show');
  setTimeout(() => $('editNome').focus(), 120);
}
function fecharEditModal(){ $('editBackdrop').classList.remove('show'); }

async function salvarEdicaoLead(){
  const id = $('editLeadId').value;
  if(!id){ fecharEditModal(); return; }
  const nome = $('editNome').value.trim();
  const telefone = normalizaTel($('editTelefone').value);
  const bairros = $('editBairros').value.trim();
  const detalhes = $('editDetalhes').value.trim();
  if(!nome){ toast('Informe o nome', 'error'); return; }
  if(telefone.length < 10){ toast('Telefone inválido', 'error'); return; }
  const btn = $('btnSalvarEdit');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Salvando...';
  marcarSalvando(true);
  const res = await api('atualizarLeadVIP', {
    senha: state.adminSenha, id: id,
    nome: nome, telefone: telefone,
    bairros: bairros || '', detalhes: detalhes || ''
  });
  marcarSalvando(false);
  btn.disabled = false;
  btn.innerHTML = '<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Salvar';
  if(!res.ok){ toast(res.error || 'Erro ao salvar', 'error'); return; }
  const item = state.lista.find(x => String(x.id) === String(id));
  if(item){ item.nome = nome; item.telefone = telefone; item.bairros = bairros; item.detalhes = detalhes; }
  toast('Lead atualizado ✅', 'success');
  fecharEditModal();
  renderizarLeads();
}

/* =====================================================
   MENSAGENS PRONTAS
===================================================== */
function montarMensagens_(item){
  const atendidoPor = String(item.atendidoPor || '').trim();
  if(!atendidoPor) return null;
  const info = CORRETORES_INFO[atendidoPor];
  const nomeCompletoCorretor = info?.nomeCompleto || atendidoPor;
  const funcaoCorretor = info?.funcao || 'Corretor(a)';
  const nomeCliente = String(item.nome || '').trim();
  const doisNomes = doisPrimeirosNomes_(nomeCliente);
  
  let tipo = item.tipo || 'imóvel';
  const detalhesStr = String(item.detalhes || '');
  const matchTipoApto = detalhesStr.match(/Tipo Apto:\s*([^|]+)/i);
  if(matchTipoApto && matchTipoApto[1].trim()) {
    tipo += ' (' + matchTipoApto[1].trim() + ')';
  }

  const bairros = String(item.bairros || '').trim();
  const bairrosList = bairros && bairros !== 'tanto-faz'
    ? bairros.split(',').map(s => s.trim()).filter(Boolean) : [];

  const saud = doisNomes ? `Oi, ${doisNomes}, tudo bem?` : 'Oi, tudo bem?';

  const msg1 = `${saud}

Sou ${nomeCompletoCorretor}, ${funcaoCorretor} da Lima Ribeiro Imóveis. Recebi sua seleção VIP e já separei algumas opções de ${tipo} que combinam com o que você procura.

Vou te enviar em instantes!`;

  let detalhesList = [];
  if(item.quartos && item.quartos !== 'tanto-faz') detalhesList.push(`${item.quartos}+ quartos`);
  if(item.banheiros && item.banheiros !== 'tanto-faz') detalhesList.push(`${item.banheiros}+ banheiros`);
  if(item.suites && item.suites !== 'tanto-faz') detalhesList.push(`${item.suites}+ suítes`);
  if(item.vagas && item.vagas !== 'tanto-faz') detalhesList.push(`${item.vagas}+ vagas`);
  if(item.metragemMin) detalhesList.push(`a partir de ${item.metragemMin} m²`);

  let msg2 = `Pelo que você me passou, você busca:`;
  if(detalhesList.length > 0){
    msg2 += '\n' + detalhesList.map(d => '• ' + d).join('\n');
  }
  if(bairrosList.length > 0){
    msg2 += '\n• Cidades/Bairros: ' + bairrosList.join(', ');
  }
  if(item.valorMax){
    msg2 += `\n• Valor: até ${fmtValorBR_(item.valorMax)}`;
  }
  msg2 += `\n\nVou fazer uma seleção caprichada e te mando as melhores opções. 👍`;

  const msg3 = `Enquanto isso, se você quiser adiantar, me conta: tem alguma coisa que é *essencial* pro seu novo imóvel? Tipo varanda, elevador, andar alto, vaga coberta, etc.

Assim eu já refino ainda mais a busca pra você.`;

  return { nomeCliente, mensagens: [msg1, msg2, msg3] };
}

function abrirMsgModal(id){
  const item = state.lista.find(x => String(x.id) === String(id));
  if(!item){ toast('Lead não encontrado', 'error'); return; }
  const atendidoPor = String(item.atendidoPor || '').trim();
  if(!atendidoPor){ toast('Escolha o corretor antes de ver as mensagens.', 'warn'); return; }
  const dados = montarMensagens_(item);
  if(!dados){ toast('Não foi possível montar as mensagens.', 'error'); return; }
  state._msgLeadAtual = id;
  $('msgNomeCliente').textContent = dados.nomeCliente || '(sem nome)';
  const rotulos = ['Abordagem inicial', 'Resumo do perfil', 'Pergunta final'];
  const blocos = dados.mensagens.map((texto, idx) => {
    const rotulo = rotulos[idx] || `Mensagem ${idx + 1}`;
    const htmlTexto = esc(texto).replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
    return `
      <div style="padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:8px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
          <span style="font-size:.7rem; font-weight:800; color:var(--vip); text-transform:uppercase; letter-spacing:.5px;">
            ${idx + 1}. ${esc(rotulo)}
          </span>
          <button onclick="copiarBloco(${idx})" style="background:#fff; border:1px solid var(--border-strong); border-radius:6px; padding:4px 10px; font-size:.7rem; font-weight:700; color:var(--text-soft); cursor:pointer;">
            Copiar
          </button>
        </div>
        <div style="font-size:.84rem; line-height:1.65; white-space:pre-wrap; word-break:break-word;">${htmlTexto}</div>
      </div>
    `;
  }).join('');
  $('msgBlocos').innerHTML = blocos;
  state._msgAtuais = dados.mensagens;
  $('msgBackdrop').classList.add('show');
}
function fecharMsgModal(){
  $('msgBackdrop').classList.remove('show');
  state._msgLeadAtual = null;
  state._msgAtuais = null;
}
function copiarBloco(idx){
  const lista = state._msgAtuais || [];
  const texto = lista[idx];
  if(!texto){ toast('Mensagem indisponível', 'error'); return; }
  copiarTextoSimples(texto, 'Mensagem ' + (idx + 1) + ' copiada');
}
function copiarTextoSimples(texto, msgSucesso){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texto)
      .then(() => toast(msgSucesso + ' ✅', 'success'))
      .catch(() => fallbackCopy(texto, msgSucesso));
  } else {
    fallbackCopy(texto, msgSucesso);
  }
}
function fallbackCopy(texto, msgSucesso){
  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    toast(msgSucesso + ' ✅', 'success');
  } catch(e){
    toast('Não foi possível copiar', 'error');
  }
  document.body.removeChild(ta);
}

/* INIT */
(async function init(){
  try {
    const senhaSalva = localStorage.getItem(ADMIN_KEY);
    if(!senhaSalva){
      document.body.innerHTML = `
        <div style="padding:60px 20px; text-align:center; font-family:sans-serif;">
          <h2 style="color:#8b3a3a;">Acesso negado</h2>
          <p style="margin-top:10px; color:#475569;">Faça login no painel administrativo primeiro.</p>
        </div>`;
      return;
    }
    state.adminSenha = senhaSalva;
    await carregarCorretores();
    await carregarLeads(true);
  } catch(err){
    console.error('Erro no init:', err);
    $('leadLista').innerHTML = '<div class="empty-state"><h3>Erro ao iniciar</h3><p>' + esc(err.message) + '</p></div>';
  }
})();

/* ESC */
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    fecharEditModal();
    fecharMsgModal();
    fecharDetalhes();
  }
});

window.abrirDetalhes = abrirDetalhes;

window.abrirMsgDoDetalhe = abrirMsgDoDetalhe;
window.abrirEditModal = abrirEditModal;
window.fecharEditModal = fecharEditModal;
window.salvarEdicaoLead = salvarEdicaoLead;
window.abrirMsgModal = abrirMsgModal;
window.fecharMsgModal = fecharMsgModal;
window.copiarBloco = copiarBloco;
window.toggleObsLead = toggleObsLead;
window.onChangeStatus = onChangeStatus;
window.onChangeCorretor = onChangeCorretor;
window.onChangeObs = onChangeObs;
window.setStatusLeads = setStatusLeads;
window.toggleFiltroCorretor = toggleFiltroCorretor;
window.limparFiltroCorretor = limparFiltroCorretor;
window.carregarLeads = carregarLeads;
window.mascaraTelefone = mascaraTelefone;
</script>
