                    link: "https://vitrine.quintoandar.com.br/imovel/v2/895398399/HugoFelipePereiraRibeiro-3M2K" },
                { tipo: "Apartamento", endereco: "Rua Veja", bairro: "Santa Lúcia", preco: 550000, quartos: 3, suites: 1,
                    banheiros: 2, vagas: 2,
                    link: "https://vitrine.quintoandar.com.br/imovel/v2/895663556/HugoFelipePereiraRibeiro-3M2K" }
            ],
            "Buritis, Estoril": [
                { tipo: "Apartamento", endereco: "Rua Ernani Agrícola", bairro: "Buritis", preco: 460000, quartos: 4,
                    suites: 1, banheiros: 2, vagas: 2,
                    link: "https://vitrine.quintoandar.com.br/imovel/v2/895474450/HugoFelipePereiraRibeiro-3M2K" },
                { tipo: "Apartamento", endereco: "Rua Paulo Piedade Campos", bairro: "Estoril", preco: 500000, quartos: 2,
                    suites: 1, banheiros: 2, vagas: 1,
                    link: "https://vitrine.quintoandar.com.br/imovel/v2/895661269/HugoFelipePereiraRibeiro-3M2K" }
            ]
        };

        // ============================================================
        // RENDERIZAÇÃO
        // ============================================================
        function formatarPreco(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(valor);
        }

        function criarDescricao(imovel) {
            let partes = [];
            if (imovel.quartos > 0) partes.push(`${imovel.quartos} quartos`);
            if (imovel.suites > 0) partes.push(`${imovel.suites} suíte${imovel.suites > 1 ? 's' : ''}`);
            if (imovel.banheiros > 0) partes.push(`${imovel.banheiros} banheiro${imovel.banheiros > 1 ? 's' : ''}`);
            if (imovel.vagas > 0) partes.push(`${imovel.vagas} vaga${imovel.vagas > 1 ? 's' : ''}`);
            return partes.join(', ');
        }

        function criarItem(imovel) {
            const descricao = criarDescricao(imovel);

            return `
                <div class="imovel-item">
                    <div class="info">
                        <span class="tipo">${imovel.tipo}</span>
                        <span class="endereco">
                            ${imovel.endereco} <span class="bairro">· ${imovel.bairro}</span>
                        </span>
                        <span class="preco">${formatarPreco(imovel.preco)}</span>
                        <span class="descricao">
                            <i class="fas fa-bed"></i> ${descricao}
                        </span>
                    </div>
                    <div class="link-wrapper">
                        <i class="fas fa-link link-icon"></i>
                        <a href="${imovel.link}" target="_blank" class="link-url">${imovel.link}</a>
                    </div>
                </div>
            `;
        }

        function renderizarImoveis(filtroTexto = '') {
            const container = document.getElementById('listaImoveis');
            let html = '';
            let total = 0;
            const filtroLower = filtroTexto.toLowerCase().trim();

            for (const [regiao, imoveis] of Object.entries(imoveisPorRegiao)) {
                let imoveisFiltrados = imoveis;

                if (filtroLower) {
                    imoveisFiltrados = imoveisFiltrados.filter(imovel =>
                        imovel.endereco.toLowerCase().includes(filtroLower) ||
                        imovel.bairro.toLowerCase().includes(filtroLower) ||
                        regiao.toLowerCase().includes(filtroLower)
                    );
                }

                if (imoveisFiltrados.length === 0) continue;

                total += imoveisFiltrados.length;

                html += `
                    <div class="regiao-section fade-in">
                        <div class="regiao-header" onclick="toggleRegiao(this)">
                            <h2>📍 ${regiao}</h2>
                            <span class="count">${imoveisFiltrados.length} imóveis</span>
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </div>
                        <div class="imovel-list">
                            ${imoveisFiltrados.map(imovel => criarItem(imovel)).join('')}
                        </div>
                    </div>
                `;
            }

            if (html === '') {
                html = `
                    <div style="text-align:center; padding:50px 20px; background:#fff; border-radius:16px; border:1px solid rgba(0,30,240,0.06);">
                        <i class="fas fa-search" style="font-size:2rem; color:#d0d7e6; margin-bottom:12px;"></i>
                        <h3 style="color:#1a1a2e; font-size:1.1rem;">Nenhum imóvel encontrado</h3>
                        <p style="color:#5a5a72; margin-top:2px; font-size:0.9rem;">Tente buscar por outro bairro ou região.</p>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('totalCountFilter').textContent = total;

            setTimeout(() => {
                document.querySelectorAll('.imovel-list').forEach(list => {
                    list.style.maxHeight = list.scrollHeight + 'px';
                });
            }, 50);
        }

        // ============================================================
        // FUNÇÃO DE FILTRO
        // ============================================================
        function filtrarImoveis() {
            const input = document.getElementById('searchInput');
            renderizarImoveis(input.value);
        }

        // ============================================================
        // TOGGLE REGIÃO
        // ============================================================
        function toggleRegiao(header) {
            const list = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');

            if (list.classList.contains('hidden')) {
                list.classList.remove('hidden');
                list.style.maxHeight = list.scrollHeight + 'px';
                icon.classList.remove('collapsed');
            } else {
                list.style.maxHeight = list.scrollHeight + 'px';
                list.offsetHeight;
                list.style.maxHeight = '0';
                list.classList.add('hidden');
                icon.classList.add('collapsed');
            }
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderizarImoveis();

            document.querySelectorAll('.imovel-list').forEach(list => {
                list.style.maxHeight = list.scrollHeight + 'px';
            });
        });

        // ============================================================
        // EXPOR FUNÇÕES GLOBAIS
        // ============================================================
        window.filtrarImoveis = filtrarImoveis;
        window.toggleRegiao = toggleRegiao;
    </script>

</body>
</html>
